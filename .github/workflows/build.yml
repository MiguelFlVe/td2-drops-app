name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Stable signature: the key is stored encrypted in the repo (app/release.jks.enc).
      # It's enabled by a single secret, SIGNING_PASSWORD. Without it, a debug key is used.
      - name: Prepare signing
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ] && [ -f app/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.jks.enc -out app/release.jks -pass env:SIGNING_PASSWORD
            echo "Stable signature enabled"
          else
            echo "No SIGNING_PASSWORD: using a debug key"
          fi

      # The version name comes from the VERSION file (bump it in every release commit).
      # The version code is the run number, so it always goes up and updates install over the old version.
      # Only main publishes. Other branches (run by hand) just check that the app builds and save the APK to "apk-test".
      - name: Check version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          if [ -z "$V" ]; then echo "::error::The VERSION file is empty."; exit 1; fi
          if gh api "repos/${{ github.repository }}/releases/tags/v$V" > /dev/null 2>&1; then
            echo "::error::Release v$V already exists. Bump the VERSION file."; exit 1
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: td2drops
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/drops-td2.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: drops-td2-apk
          path: out/drops-td2.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          { [ -f RELEASE_NOTES.md ] && cat RELEASE_NOTES.md && echo
            echo "Download **drops-td2.apk** on your Android phone and open it to install. Free, non-profit fan tool; not affiliated with Ubisoft or Massive Entertainment."
          } > /tmp/notes.md
          gh release create "$TAG" out/drops-td2.apk \
            --repo "${{ github.repository }}" \
            --title "Drops TD2 $VERSION_NAME" \
            --notes-file /tmp/notes.md \
            --latest

      - name: Save APK to the apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apkbranch && cp out/drops-td2.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops-td2.apk
          git commit -q -m "APK $VERSION_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Save test APK to the apk-test branch
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/apktest && cp out/drops-td2.apk /tmp/apktest/
          cd /tmp/apktest
          git init -q -b apk-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops-td2.apk
          git commit -q -m "Test APK from ${{ github.ref_name }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-test
