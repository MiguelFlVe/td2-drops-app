<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1013">
<title>Drops TD2</title>
<style>
:root{
  --bg:#0e1013; --surface:#171a1f; --surface2:#1f232a; --border:#2b3039; --text:#e9ebef; --muted:#97a0ad;
  --accent:#ff7417; --accent-ink:#1b0c00; --accent-soft:rgba(255,116,23,.14);
  --red:#f0564f; --blue:#4d8dff; --yellow:#efc23a; --gold:#e8b44c; --gold-soft:rgba(232,180,76,.12); --ok:#39c58a; --danger:#f0564f;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f4f6; --surface:#ffffff; --surface2:#f0f2f5; --border:#d8dce2; --text:#14171c; --muted:#5b6370;
    --accent:#e2600a; --accent-ink:#ffffff; --accent-soft:rgba(226,96,10,.12);
    --red:#d63c35; --blue:#2f6fe0; --yellow:#b88a00; --gold:#9a6b00; --gold-soft:rgba(184,138,0,.10); --ok:#1f9a65; --danger:#d63c35; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.brandmark{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:12px}
.t1{font-weight:800;letter-spacing:.02em}
.t2{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.field{margin:14px 0}
.field:first-child{margin-top:2px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;line-height:1.15;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.cols-2{display:grid;grid-template-columns:1fr 1fr}
.chips.cols-3{display:grid;grid-template-columns:repeat(3,1fr)}
.chip{min-height:42px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-size:14px;text-align:left;line-height:1.2;display:flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.chip.any{color:var(--muted)}
.chip.any[aria-pressed="true"]{color:var(--text)}
.chip:disabled{opacity:.4}
.c-red{background:var(--red)} .c-blue{background:var(--blue)} .c-yellow{background:var(--yellow)}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:16px;width:100%;min-height:44px;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px}
textarea{line-height:1.4;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.fixed{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:8px 12px}
.fixed-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.fixed-row .k{color:var(--muted)}
.fixed-row .fx{display:flex;align-items:center;gap:8px}
.fixed-row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.perk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--gold);background:var(--gold-soft);font-size:14px}
.perk svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--gold)}
.perk small{display:block;color:var(--muted);font-size:12px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actionbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:10px 0 4px;margin-top:4px}
.actionbar .missing{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0}
.step.locked{opacity:.55}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step.locked .step-h{margin-bottom:4px}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface2);border:1px solid var(--border);flex:none}
.step.done .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step-s{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked-hint{font-size:13px;color:var(--muted);padding-left:34px}
.sub-lbl{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px 10px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:20;
  background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;padding:4px}
.banner{margin:12px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--yellow);background:rgba(239,194,58,.12);font-size:13px}
.banner .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .acts .btn{min-height:38px;padding:6px 12px;font-size:13px}
.big{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .v small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal}
table.bd{width:100%;border-collapse:collapse;font-size:13px}
table.bd th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border)}
table.bd td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums}
table.bd td.num,table.bd th.num{text-align:right;white-space:nowrap}
table.bd td small{display:block;color:var(--muted)}
table.bd tr.total td{font-weight:800;border-bottom:0}
details{margin-top:4px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
details p,details li{font-size:13px;color:var(--muted)}
details ul{padding-left:18px;margin:6px 0}
.inline{display:flex;align-items:center;gap:10px}
.inline input{width:96px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.drop{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.drop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drop-title{font-weight:700}
.drop-sub{font-size:13px;color:var(--muted)}
.drop-time{font-size:12px;color:var(--muted)}
.vhead{display:flex;align-items:center;gap:12px;margin:12px 0}
.vhead .btn{min-height:38px;padding:6px 12px}
.video-entry{margin:12px 0 2px;justify-content:space-between;text-align:left}
.video-entry small{font-weight:500;color:var(--muted);font-size:12px}
.progress{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.tips{margin:0;padding-left:20px;font-size:14px;line-height:1.45}
.tips li{margin:4px 0}
.vitem{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.vitem.off{opacity:.6}
.vitem.bad{border-color:var(--danger)}
.vitem-h{display:flex;align-items:center;gap:10px;cursor:pointer}
.vitem-h input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.vitem-t{flex:1;min-width:0}
.vitem-t small{display:block;color:var(--muted);font-size:12px}
.pill.warn{border-color:var(--yellow);color:var(--text);background:rgba(239,194,58,.15)}
.vitem-b{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;padding-left:32px}
.vitem-b .small{flex:1 1 100%}
.vmiss{color:var(--danger);font-size:13px;font-weight:600}
.vedit{min-height:34px;padding:4px 12px;font-size:13px;margin-left:auto}
.vedit-box{margin-top:8px;border-top:1px solid var(--border);padding-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.talent{border-color:var(--accent);color:var(--accent)}
.tag.perk-tag{border-color:var(--gold);color:var(--gold)}
.tag.warn-tag{border-color:var(--danger);color:var(--danger);font-weight:700}
.tag.rar{font-weight:700}
.icon-btn{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted)}
.wt-row{border-top:1px solid var(--border);padding:10px 0}
.wt-row:first-child{border-top:0}
.wt-top{display:flex;gap:8px;align-items:center}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.mchip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.panel{margin-top:10px}
.panel textarea,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.warn{color:var(--yellow)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.basetoggle{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin:10px 0 0;cursor:pointer}
.basetoggle input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.basetoggle b{display:block;font-size:14px}
.basetoggle small{display:block;color:var(--muted);font-size:12px}
.corelist{display:grid;gap:8px}
.corerow{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.corerow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.corerow .cr-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;line-height:1.2}
.corerow .cr-p{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.corerow small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.corerow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.onboard{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.onboard .box{max-width:420px;width:100%}
.onboard .logo{width:56px;height:56px;border-radius:14px;font-size:18px;margin-bottom:18px}
.onboard h1{font-size:22px;line-height:1.25;margin:0 0 8px}
.onboard p{color:var(--muted);margin:0 0 18px}
.onboard .btn{margin-top:10px}
.dbline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px}
.dbline .name{font-weight:700;word-break:break-all}
.dbline .btn{min-height:36px;padding:6px 12px;font-size:13px;flex:none}
@media (max-width:360px){ .chips.cols-3{grid-template-columns:1fr 1fr} .big{font-size:36px} .stat b{font-size:18px} }
</style>
</head>
<body>
<header class="app">
  <div class="wrap bar">
    <div class="brandmark">
      <div class="logo">TD2</div>
      <div><div class="t1">Drops TD2</div><div class="t2">Drop log &amp; roll odds</div></div>
    </div>
    <span id="count" class="pill">0 drops</span>
  </div>
</header>
<div class="wrap"><div id="banner" class="banner" hidden></div></div>
<main class="wrap">
  <section class="view" data-view="log"><div id="log"></div></section>
  <section class="view" data-view="odds" hidden><div id="odds-form"></div><div id="odds-results"></div></section>
  <section class="view" data-view="hist" hidden><div id="hist"></div></section>
  <section class="view" data-view="cat" hidden><div id="catalog"></div></section>
</main>
<div id="onboard" class="onboard" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-go="log" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Log drop</button>
    <button type="button" data-go="odds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Odds</button>
    <button type="button" data-go="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>History</button>
    <button type="button" data-go="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Catalog</button>
  </div>
</nav>

<!-- Base data bundled with the app (optional). If the file is missing, the app works the same. -->
<script src="base-data.js" onerror="window.TD2_BASE = null"></script>
<script>
(function(){
'use strict';
/* ================= Game data (defaults; editable in the Catalog tab) ================= */
const ANY = '*';
const HE = 'High End', NAMED = 'Named', GS = 'Gear Set';
const CATS = ['brand', 'gear', 'weapon'];
const CAT_LABEL = {brand:'Brand Set', gear:'Gear Set', weapon:'Weapon'};
const CORES = ['Weapon Damage', 'Armor', 'Skill Tier'];
const GEAR_SLOTS = ['Mask', 'Backpack', 'Chest', 'Gloves', 'Holster', 'Kneepads'];
const TALENT_SLOTS = ['Chest', 'Backpack'];
const WEAPON_TYPES = ['Rifle', 'Marksman Rifle', 'Assault Rifle', 'Submachine Gun', 'Light Machine Gun', 'Shotgun', 'Pistol'];
const W_SHORT = {'Rifle':'Rifle', 'Marksman Rifle':'MMR', 'Assault Rifle':'AR', 'Submachine Gun':'SMG', 'Light Machine Gun':'LMG', 'Shotgun':'Shotgun', 'Pistol':'Pistol'};
const WEAPON_CORE = {
  'Rifle':             {core1:'Rifle Damage',             core2:'Critical Hit Damage'},
  'Marksman Rifle':    {core1:'Marksman Rifle Damage',    core2:'Headshot Damage'},
  'Assault Rifle':     {core1:'Assault Rifle Damage',     core2:'Damage to Health'},
  'Submachine Gun':    {core1:'SMG Damage',               core2:'Critical Hit Chance'},
  'Light Machine Gun': {core1:'LMG Damage',               core2:'Damage to Targets Out of Cover'},
  'Shotgun':           {core1:'Shotgun Damage',           core2:'Damage to Armor'},
  'Pistol':            {core1:'Pistol Damage',            core2:null}
};
const COLOR = {
  'Weapon Damage':'red', 'Armor':'blue', 'Skill Tier':'yellow',
  'Critical Hit Chance':'red', 'Critical Hit Damage':'red', 'Headshot Damage':'red', 'Weapon Handling':'red',
  'Damage to Armor':'red', 'Damage to Health':'red', 'Damage to Targets Out of Cover':'red',
  'Armor Regeneration':'blue', 'Hazard Protection':'blue', 'Health':'blue', 'Explosive Resistance':'blue',
  'Skill Damage':'yellow', 'Skill Haste':'yellow', 'Repair Skills':'yellow', 'Status Effects':'yellow'
};
/* Exceptions to the usual rolls: these items always have all three core attributes and no minor attributes
   (the Core Strength backpack), so there's nothing left to roll. */
const ALL_CORES_ITEMS = [{cat:'gear', set:'Core Strength', slot:'Backpack'}];
const allCoresItem = s => !!s && ALL_CORES_ITEMS.some(x => x.cat === s.cat && x.set === s.set && x.slot === s.slot);
/* Named weapons whose perk only changes the weapon's base stats (First Sight: +30% Headshot Damage, -50% Reload Speed).
   Nothing is locked on them: they roll an attribute and a talent like a High End weapon of their type. */
const STAT_ONLY_NAMED = [{cat:'weapon', slot:'Assault Rifle', named:'First Sight'}];
const statOnlyNamed = s => !!s && s.rarity === NAMED && STAT_ONLY_NAMED.some(x => x.cat === s.cat && x.slot === s.slot && x.named === s.named);
/* Named gear that doesn't follow the usual "unique attribute + 1 attribute" roll (source: Division 2 Gear Spreadsheet).
   fixed: attributes that always come already rolled (nothing left to pick); exclude: attributes the free one can't be. */
const NAMED_GEAR_ROLLS = [
  {named:'Turmoil', set:'Česká Výroba s.r.o.', fixed:['Critical Hit Damage', 'Critical Hit Chance']},
  {named:'Punch Drunk', set:'Douglas & Harding', exclude:['Headshot Damage']},
  {named:"Eagle's Grasp", set:'Zwiadowka Sp. z o.o.', exclude:['Weapon Handling']},
  {named:'Firm Handshake', set:'Sokolov Concern', exclude:['Status Effects']}
];
const namedRule = s => !!s && s.cat === 'brand' && s.rarity === NAMED && NAMED_GEAR_ROLLS.find(x => x.named === s.named && x.set === s.set) || null;
const T_ABBR = {AR:'Assault Rifle', LMG:'Light Machine Gun', MMR:'Marksman Rifle', RIF:'Rifle', SG:'Shotgun', SMG:'Submachine Gun', PIS:'Pistol'};
const WT = (n, types) => ({n, w: types ? types.split(',').map(x => T_ABBR[x.trim()]) : WEAPON_TYPES.slice()});
const NG = s => { const [n, set, slot, perk] = s.split('|'); return {n, set, slot, perk}; };

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const dot = c => c ? h('span', {class:'dot c-' + c}) : null;

function fmtPct(p){
  if (!isFinite(p) || p <= 0) return '0%';
  const v = p * 100;
  let s;
  if (p >= 1) s = '100';
  else if (v >= 99.95) return '>99.9%';
  else if (v >= 10) s = v.toLocaleString('en-US', {maximumFractionDigits:1});
  else if (v >= 1) s = v.toLocaleString('en-US', {maximumFractionDigits:2});
  else s = v.toLocaleString('en-US', {maximumSignificantDigits:3});
  return s + '%';
}
const fmtInt = n => isFinite(n) ? Math.round(n).toLocaleString('en-US') : '∞';
const fmtNum = (n, d) => (n > 0 && n < 0.01)
  ? n.toLocaleString('en-US', {maximumSignificantDigits: 2})
  : n.toLocaleString('en-US', {maximumFractionDigits: d == null ? 1 : d});
const plural = (n, one, many) => fmtInt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
function needed(p, q){ if (p <= 0) return Infinity; if (p >= 1) return 1; return Math.ceil(Math.log(1 - q) / Math.log(1 - p)); }
function parseLines(t){ const seen = new Set(); return t.split(/\r?\n/).map(s => s.trim()).filter(s => s && !seen.has(s) && seen.add(s)); }
function cleanList(a){ return Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : null; }
function inc(o, k){ if (k == null || k === '') return; o[k] = (o[k] || 0) + 1; }

/* Returns a drop in the current format, or null if it can't be read.
   Items with all three cores (Core Strength backpack) never store a core, attributes or talent: before 2.1.1
   the app made you pick one core and one attribute for them, so those placeholders are dropped. */
function migrateDrop(d){
  const r = readDrop(d);
  if (r && allCoresItem(r)){ r.core = null; r.attrs = []; r.talent = null; }
  return r;
}
function readDrop(d){
  if (!d || typeof d !== 'object') return null;
  if (CATS.includes(d.cat)){
    return {id: d.id || uid(), ts: d.ts || 0, cat: d.cat, set: d.set || null, slot: d.slot || null,
      rarity: d.rarity || (d.cat === 'gear' ? GS : HE), named: d.named || null, core: d.core || null,
      attrs: Array.isArray(d.attrs) ? d.attrs.slice() : [], talent: d.talent || null, note: d.note || undefined};
  }
  const attrs = (Array.isArray(d.minors) ? d.minors : []).map(m => ES.attr[m] || m);
  if (d.cat === 'Equipo'){
    const cat = d.clase === 'Gear' ? 'gear' : 'brand';
    let set = d.set || (cat === 'gear' && d.talent ? d.talent : null);   // v1.0 stored the Gear Set as the talent
    if (set) set = ES.brand[set] || set;
    return {id: d.id || uid(), ts: d.ts || 0, cat, set, slot: ES.slot[d.sub] || d.sub || null, rarity: cat === 'gear' ? GS : HE, named: null,
      core: ES.core[d.core] || d.core || null, attrs, talent: cat === 'brand' ? (d.talent || null) : null, note: d.note || undefined};
  }
  if (d.cat === 'Arma'){
    return {id: d.id || uid(), ts: d.ts || 0, cat: 'weapon', set: null, slot: ES.wtype[d.sub] || d.sub || null, rarity: HE, named: null,
      core: null, attrs, talent: d.talent || null, note: d.note || undefined};
  }
  return null;
}

/* A core map keeps only valid entries: name -> core, or (Gear Sets) name -> {slot: core} for sets split by slot. */
function cleanCores(m, bySlot){
  const out = {};
  if (!m || typeof m !== 'object') return out;
  for (const k in m){
    const v = m[k];
    if (CORES.includes(v)) out[k] = v;
    else if (bySlot && v && typeof v === 'object'){
      const s = {}; for (const slot of GEAR_SLOTS) if (CORES.includes(v[slot])) s[slot] = v[slot];
      if (Object.keys(s).length) out[k] = s;
    }
  }
  return out;
}

   A v3 catalog is upgraded by adding what 2.2 brought from the Division 2 Gear Spreadsheet (native cores, the 13 weapon
   attributes, talent types, new Named items) while keeping everything you added or edited. */
function normalizeCatalog(c){
  const d = clone(DEFAULT_CATALOG);
  if (!c || typeof c !== 'object' || (c.v !== 3 && c.v !== CATALOG_V)) return d;
  const list = k => cleanList(c[k]) || d[k];
  const out = {v: CATALOG_V, brands: list('brands'), brandCores: cleanCores(c.brandCores, false), gearSets: list('gearSets'),
    setCores: cleanCores(c.setCores, true), gearAttrs: list('gearAttrs'), weaponAttrs: list('weaponAttrs'),
    chestTalents: list('chestTalents'), backpackTalents: list('backpackTalents')};
  out.weaponTalents = Array.isArray(c.weaponTalents)
    ? c.weaponTalents.filter(t => t && typeof t.n === 'string' && t.n.trim()).map(t => ({n: t.n.trim(), w: (Array.isArray(t.w) ? t.w : []).filter(x => WEAPON_TYPES.includes(x))}))
    : d.weaponTalents;
  out.namedGear = Array.isArray(c.namedGear)
    ? c.namedGear.filter(x => x && x.n && x.set && GEAR_SLOTS.includes(x.slot)).map(x => ({n: String(x.n), set: String(x.set), slot: x.slot, perk: String(x.perk || 'Unique perk')}))
    : d.namedGear;
  out.namedWeapons = Array.isArray(c.namedWeapons)
    ? c.namedWeapons.filter(x => x && x.n && WEAPON_TYPES.includes(x.type)).map(x => ({n: String(x.n), type: x.type, perk: String(x.perk || 'Unique talent'), base: String(x.base || '')}))
    : d.namedWeapons;
  if (c.v === 3) upgradeV3(out, d);
  return out;
}
function upgradeV3(out, d){
  for (const k of ['brands', 'gearSets', 'gearAttrs', 'weaponAttrs', 'chestTalents', 'backpackTalents'])
    for (const x of d[k]) if (!out[k].includes(x)) out[k].push(x);
  for (const n of out.brands) if (d.brandCores[n]) out.brandCores[n] = d.brandCores[n];
  for (const n of out.gearSets) if (d.setCores[n]) out.setCores[n] = clone(d.setCores[n]);
  for (const t of d.weaponTalents){
    const mine = out.weaponTalents.find(x => x.n === t.n);
    if (!mine) out.weaponTalents.push(clone(t));
    else for (const w of t.w) if (!mine.w.includes(w)) mine.w.push(w);
  }
  for (const x of d.namedGear) if (!out.namedGear.some(y => y.n === x.n && y.slot === x.slot)) out.namedGear.push(clone(x));
  for (const x of d.namedWeapons) if (!out.namedWeapons.some(y => y.n === x.n && y.type === x.type)) out.namedWeapons.push(clone(x));
}

/* Base data: drops bundled with the app (assets/base-data.js). Not shown in History, but used for the odds
   while "Include base data" is on. Drops that are also in your own file (same id) are not counted twice. */
const BASE = (() => {
  const b = window.TD2_BASE;
  if (!b || !Array.isArray(b.drops)) return null;
  const drops = migrateAll(b.drops);
  return drops.length ? {label: typeof b.label === 'string' && b.label.trim() ? b.label.trim() : 'Base data', drops} : null;
})();
function estDrops(){
  if (!BASE || !S.useBase) return S.drops;
  const own = new Set(S.drops.map(d => d.id));
  return S.drops.concat(BASE.drops.filter(d => !own.has(d.id)));
}

const NATIVE = !!window.AndroidDB;
let db = {hasFile:false, name:''}, dbBlocked = false, dbError = '', lastText = '', pendingBackup = false;

function applyData(d){
  const before = JSON.stringify(S.catalog);
  S.useBase = !(d && d.settings && d.settings.useBase === false);
  S.drops = migrateAll(d && d.drops);
  S.catalog = d && d.catalog ? normalizeCatalog(d.catalog) : clone(DEFAULT_CATALOG);
  S.backupTs = (d && d.backupTs) || 0;
  return JSON.stringify(S.catalog) !== before;   // true if the catalog changed
}
function serialize(){
  return JSON.stringify({app:'td2-drop-tracker', v:3, updated:new Date().toISOString(), backupTs:S.backupTs,
    settings:{useBase:S.useBase}, catalog:S.catalog, drops:S.drops}, null, 2);
}
function isDbData(d){ return !!d && typeof d === 'object' && !Array.isArray(d) && (Array.isArray(d.drops) || d.app === 'td2-drop-tracker'); }
function parseDb(text){ try{ const d = JSON.parse(text); return isDbData(d) ? d : null; }catch(e){ return null; } }

/* ---- Android bridge ---- */
function nCall(fn, ...a){ try{ return window.AndroidDB[fn](...a); }catch(e){ return null; } }
function nJSON(fn, ...a){ const r = nCall(fn, ...a); try{ return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function nativeStatus(){ db = nJSON('status') || {hasFile:false, name:''}; }
function loadCacheInto(){ const d = parseDb(nCall('loadCache') || ''); if (d) applyData(d); }
function nativeLoad(){
  nativeStatus();
  dbBlocked = false; dbError = '';
  if (!db.hasFile){ loadCacheInto(); return; }
  const r = nJSON('load') || {ok:false, error:'unknown error'};
  if (!r.ok){
    dbBlocked = true;
    dbError = 'Couldn’t open ' + (db.name || 'your data file') + ' (was it moved or deleted?). You’re seeing the app’s internal copy: pick the file again or create a new one.';
    loadCacheInto(); return;
  }
  const text = r.text || '';
  if (!text.trim()){ loadCacheInto(); persist(); return; }
  const d = parseDb(text);
  if (!d){
    dbBlocked = true;
    dbError = (db.name || 'The file') + ' isn’t a valid Drops TD2 database, so it won’t be changed. You’re seeing the app’s internal copy.';
    loadCacheInto(); return;
  }
  applyData(d); lastText = text; nCall('saveCache', text);
}
function nativePick(mode){ nCall(mode === 'create' ? 'createDb' : 'openDb'); }

window.__dbReady = function(mode){
  const wasBlocked = dbBlocked, before = S.drops.slice();
  nativeStatus();
  if (mode === 'created'){
    dbBlocked = false; persist();
    toast('Database created: ' + db.name);
  } else {
    const r = nJSON('load');
    const text = r && r.ok ? (r.text || '') : null;
    const d = text && text.trim() ? parseDb(text) : null;
    if (text === null){ alert('Couldn’t read that file.'); nCall('revert'); nativeStatus(); }
    else if (!text.trim()){ dbBlocked = false; persist(); toast('Empty file: your current data was saved to it'); }
    else if (!d){ alert('That file isn’t a Drops TD2 database or backup.'); nCall('revert'); nativeStatus(); }
    else {
      if (applyData(d)) resetSelections();
      lastText = text; dbBlocked = false; storageOK = true; dbError = '';
      if (wasBlocked){
        const ids = new Set(S.drops.map(x => x.id)); let extra = 0;
        for (const x of before) if (x && x.id && !ids.has(x.id)){ S.drops.push(x); extra++; }
        if (extra){ S.drops.sort((a, b) => a.ts - b.ts); persist(); }
        else nCall('saveCache', text);
      } else nCall('saveCache', text);
      toast('Opened ' + db.name + ' (' + plural(S.drops.length, 'drop') + ')');
    }
  }
  updateChrome(); renderView();
};
window.__onResume = function(){
  if (!db.hasFile || dbBlocked) return;
  const r = nJSON('load');
  if (!r || !r.ok){ nativeLoad(); updateChrome(); renderView(); return; }
  if (r.text && r.text.trim() && r.text !== lastText){
    const d = parseDb(r.text);
    if (d){ if (applyData(d)) resetSelections(); lastText = r.text; nCall('saveCache', r.text); updateChrome(); renderView(); toast('Reloaded: the file changed outside the app'); }
  }
};
window.__onBack = function(){

  if (V.open){ closeVideo(); return true; }

};
window.__nativeImport = function(text){ importData(text); renderView(); };
window.__nativeSaved = function(ok, msg){

};

/* ---- Browser ---- */
function load(){
  try{
    localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test');
    const raw = localStorage.getItem(KEY);
    if (raw) applyData(JSON.parse(raw));
  }catch(e){ storageOK = false; }
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
function persist(){
  if (NATIVE){
    const text = serialize();
    if (db.hasFile && !dbBlocked){
      const r = nCall('save', text);
      if (r === 'ok'){ storageOK = true; dbError = ''; lastText = text; }
      else { storageOK = false; dbError = 'Couldn’t save to ' + (db.name || 'the file') + ' (' + (r || 'unknown error') + '). Your changes are kept in the app’s internal copy.'; }
    } else nCall('saveCache', text);
  } else {
    try{ localStorage.setItem(KEY, JSON.stringify({v:3, drops:S.drops, catalog:S.catalog, backupTs:S.backupTs, settings:{useBase:S.useBase}})); storageOK = true; }
    catch(e){ storageOK = false; }
  }
  updateChrome();
}
function updateChrome(){
  $('#count').textContent = plural(S.drops.length, 'drop');
  const b = $('#banner');
  if (NATIVE){
    $('#onboard').hidden = db.hasFile;
    if (!db.hasFile) renderOnboard();
    const show = db.hasFile && (dbBlocked || !storageOK);
    b.hidden = !show;
    if (show) b.replaceChildren(h('div', {}, dbError || 'There’s a problem with the data file.'),
      h('div', {class:'acts'},
        h('button', {type:'button', class:'btn', onclick: () => nativePick('open')}, 'Open file'),
        h('button', {type:'button', class:'btn', onclick: () => nativePick('create')}, 'Create new file')));
    return;
  }
  if (!storageOK){
    b.hidden = false;
    b.textContent = 'This browser isn’t letting the page save data. Export a backup often from History so you don’t lose your drops.';
  } else b.hidden = true;
}

/* ================= Catalog helpers ================= */
const C = () => S.catalog;
function setList(cat){ return (cat === 'gear' ? C().gearSets : C().brands).slice().sort(coll); }
function namedOptions(sel){
  if (sel.cat === 'brand' && sel.set && sel.slot) return C().namedGear.filter(x => x.set === sel.set && x.slot === sel.slot);
  if (sel.cat === 'weapon' && sel.slot) return C().namedWeapons.filter(x => x.type === sel.slot).sort((a, b) => coll(a.n, b.n));
  return [];
}
function findNamed(sel){ return sel.rarity === NAMED && sel.named ? namedOptions(sel).find(x => x.n === sel.named) || null : null; }
/* Core attributes a gear item can drop with: just its brand's or set's native core, or all three when it's random. */
function corePool(s){
  if (!s || s.cat === 'weapon') return [];
  const c = s.cat === 'brand' ? C().brandCores[s.set] : C().setCores[s.set];
  if (typeof c === 'string') return [c];
  if (c && c[s.slot]) return [c[s.slot]];
  return CORES.slice();
}
/* A drop whose core isn't its item's native one (it can't drop like that: usually a logging slip) */
function offCore(d){
  if (!d || d.cat === 'weapon' || !d.core || allCoresItem(d)) return null;
  const pool = corePool(d);
  return pool.length === 1 && d.core !== pool[0] ? pool[0] : null;
}
function weaponTalentPool(type){ return C().weaponTalents.filter(t => t.w.includes(type)).map(t => t.n).sort(coll); }

/* What can roll on an item (after steps 1-3) */
function itemInfo(sel){
  const named = findNamed(sel);
  if (sel.cat === 'weapon'){
    const wc = WEAPON_CORE[sel.slot] || {core1: sel.slot + ' Damage', core2: null};
    const statOnly = !!named && statOnlyNamed(sel), locked = !!named && !statOnly;
    return {hasCore: false, core1: wc.core1, core2: wc.core2, attrSlots: 1,
      attrPool: C().weaponAttrs.filter(a => a !== wc.core2),
      talentPool: locked ? [] : weaponTalentPool(sel.slot),
      lockedTalent: locked ? named.perk : null, lockedAttr: null, statPerk: statOnly ? named.perk : null, named,
      corePool: [], fixedCore: null, fixedAttrs: null, sameRoll: false};
  }
  const talentSlot = TALENT_SLOTS.includes(sel.slot);
  const pool = corePool(sel);
  const base = {hasCore: true, corePool: pool, fixedCore: pool.length === 1 ? pool[0] : null, coreFrom: sel.cat === 'gear' ? 'Gear Set' : 'brand',
    attrPool: C().gearAttrs.slice(), named, lockedAttr: null, lockedTalent: null, talentPool: [], fixedAttrs: null};
  let info;
  if (sel.cat === 'gear' && allCoresItem(sel))
    info = Object.assign(base, {hasCore: false, fixedCores: CORES.slice(), fixedCore: null, corePool: [], attrSlots: 0, attrPool: [], lockedTalent: 'Gear Set talent (comes with the set)'});
  else if (sel.cat === 'gear') info = Object.assign(base, {attrSlots: 1, lockedTalent: talentSlot ? 'Gear Set talent (comes with the set)' : null});
  else if (named){
    const rule = namedRule(sel);
    if (talentSlot) info = Object.assign(base, {attrSlots: 2, lockedTalent: named.perk});
    else if (rule && rule.fixed) info = Object.assign(base, {attrSlots: 0, fixedAttrs: rule.fixed.slice(), lockedTalent: named.perk,
      attrPool: base.attrPool.filter(a => !rule.fixed.includes(a))});
    else info = Object.assign(base, {attrSlots: 1, lockedAttr: named.perk,
      attrPool: base.attrPool.filter(a => !(rule && rule.exclude || []).includes(a))});
  }
  else info = Object.assign(base, {attrSlots: 2, talentPool: talentSlot ? (sel.slot === 'Chest' ? C().chestTalents : C().backpackTalents).slice().sort(coll) : []});
  // Nothing left to chance: every drop of this item rolls the same
  info.sameRoll = !!info.fixedCores || (!!info.fixedCore && info.attrSlots === 0 && !info.talentPool.length);
  return info;
}
const itemKey = s => [s.cat, s.set || '', s.slot || '', s.rarity || '', s.named || ''].join('|');
function itemName(s){
  if (s.cat === 'weapon') return s.rarity === NAMED && s.named ? s.named : 'High End ' + s.slot;
  if (s.rarity === NAMED && s.named) return s.named;
  return (s.set || 'Unknown ' + (s.cat === 'gear' ? 'Gear Set' : 'brand')) + ' ' + (s.slot || '');
}
function itemSub(s){
  if (s.cat === 'weapon') return s.rarity === NAMED ? 'Named ' + s.slot : s.slot;
  if (s.rarity === NAMED) return 'Named · ' + (s.set || '') + ' ' + (s.slot || '');
  return CAT_LABEL[s.cat] + (s.cat === 'brand' ? ' · High End' : '');
}

/* ================= Shared steps 1-3 (type → slot → set → rarity) ================= */
const SEL_ORDER = ['cat', 'slot', 'set', 'rarity', 'named'];
const blankSel = () => ({cat:null, set:null, slot:null, rarity:null, named:null});
function stepDone(sel, k){
  if (k === 1) return !!sel.cat;
  if (k === 2) return stepDone(sel, 1) && !!sel.slot && (sel.cat === 'weapon' || !!sel.set);
  if (k === 3) return stepDone(sel, 2) && (sel.cat === 'gear' || sel.rarity === HE || (sel.rarity === NAMED && !!sel.named));
  return false;
}
/* Picking a value resets everything after it. Returns true if the selection changed. */
function applySel(sel, key, v){
  if (sel[key] === v) return false;
  sel[key] = v;
  for (let j = SEL_ORDER.indexOf(key) + 1; j < SEL_ORDER.length; j++) sel[SEL_ORDER[j]] = null;
  if (sel.cat === 'gear' && sel.slot && sel.set) sel.rarity = GS;
  if (sel.rarity === NAMED && !sel.named){ const o = namedOptions(sel); if (o.length === 1) sel.named = o[0].n; }
  return true;
}
function chips(options, selected, onPick, cols){
  const wrap = h('div', {class: 'chips' + (cols ? ' cols-' + cols : '')});
  for (const o of options){
    const on = Array.isArray(selected) ? (o.any ? selected.length === 0 : selected.includes(o.v)) : selected === o.v;
    wrap.append(h('button', {type:'button', class:'chip' + (o.any ? ' any' : ''), 'aria-pressed': on ? 'true' : 'false',
      disabled: o.disabled, onclick: () => onPick(o.v)}, dot(o.color), o.sub ? h('span', {}, o.label, h('small', {}, o.sub)) : o.label));
  }
  return wrap;
}
function seg(options, selected, onPick){

  for (const o of options) wrap.append(h('button', {type:'button', 'aria-pressed': selected === o.v ? 'true' : 'false', disabled: o.disabled,
    onclick: () => onPick(o.v)}, o.label));

}
function field(label, control, hint){

}
function selectBox(pool, value, onChange, emptyLabel, labelFn){

  s.append(h('option', {value:''}, emptyLabel));

const opt = (v, extra) => Object.assign({v, label: v, color: COLOR[v]}, extra || {});
const anyOpt = {v: ANY, label: 'Any', any: true};
function card(title, ...kids){ return h('div', {class:'card'}, title ? h('h2', {}, title) : null, ...kids); }
function kv(k, v, small){ return h('div', {class:'kv'}, h('span', {class:'k'}, k), h('span', {class:'v'}, v, small ? h('small', {}, small) : null)); }
function perkBox(title, text){ return h('div', {class:'perk'}, lockIcon(), h('div', {}, h('small', {}, title), h('b', {}, text))); }
function toggleMulti(arr, v, lim){
  const i = arr.indexOf(v);

  while (arr.length > lim) arr.shift();

function stepCard(n, title, state, summary, body, hint){
  return h('section', {class:'step ' + state},
    h('div', {class:'step-h'}, h('span', {class:'step-n'}, state === 'done' ? '✓' : String(n)), h('span', {class:'step-t'}, title),
      summary ? h('span', {class:'step-s'}, summary) : null),

/* Renders steps 1-3 for a selection. onChange(key, value) is called with the picked value. */
function itemSteps(sel, onChange){
  const out = [];
  const d1 = stepDone(sel, 1), d2 = stepDone(sel, 2), d3 = stepDone(sel, 3);
  const isW = sel.cat === 'weapon', setWord = sel.cat === 'gear' ? 'Gear Set' : 'brand';
  // Step 1: type
  const b1 = seg(CATS.map(c => ({v:c, label:CAT_LABEL[c]})), sel.cat, v => onChange('cat', v));
  out.push(stepCard(1, 'Type', d1 ? 'done' : 'open', d1 ? CAT_LABEL[sel.cat] : '', b1));
  // Step 2: slot / weapon type, then (gear) the set
  const b2 = h('div', {}, chips((isW ? WEAPON_TYPES : GEAR_SLOTS).map(s => opt(s)), sel.slot, v => onChange('slot', v), isW ? 2 : 3));
  if (!isW && sel.slot){
    b2.append(h('div', {class:'sub-lbl'}, 'Which ' + setWord + '?'),
      selectBox(setList(sel.cat), sel.set, v => onChange('set', v || null), '— Choose the ' + setWord + ' —'));
  }
  out.push(stepCard(2, isW ? 'Weapon type' : 'Slot & set', !d1 ? 'locked' : d2 ? 'done' : 'open', d2 ? (isW ? sel.slot : sel.slot + ' · ' + sel.set) : '', b2,
    'Choose the type first.'));
  // Step 3: rarity
  let b3;
  if (sel.cat === 'gear') b3 = h('div', {class:'note'}, 'Gear Set pieces have a single rarity.');
  else if (d2){
    const named = namedOptions(sel);
    b3 = h('div', {}, seg([{v:HE, label:'High End'}, {v:NAMED, label: named.length ? 'Named' : 'Named (none)', disabled: !named.length}],
      sel.rarity, v => onChange('rarity', v)));
    if (!named.length && sel.cat === 'brand') b3.append(h('div', {class:'small muted', style:'margin-top:8px'}, 'There’s no Named item for this brand and slot.'));
    if (sel.rarity === NAMED){
      if (named.length > 4){
        b3.append(h('div', {class:'sub-lbl'}, 'Which Named ' + W_SHORT[sel.slot] + '?'),
          selectBox(named.map(x => x.n), sel.named, v => onChange('named', v || null), '— Choose the Named item —',
            n => { const x = named.find(y => y.n === n); return n + (x && x.base ? ' (' + x.base + ')' : '') + ' — ' + (x ? x.perk : ''); }));
      } else {
        b3.append(h('div', {class:'sub-lbl'}, named.length > 1 ? 'Which one?' : 'Named item'),
          chips(named.map(x => ({v:x.n, label:x.n, sub:x.perk})), sel.named, v => onChange('named', v), 1));
      }
    }
  }
  const sum3 = !d3 ? '' : sel.cat === 'gear' ? GS : sel.rarity === NAMED ? sel.named : HE;
  out.push(stepCard(3, 'Rarity', !d2 ? 'locked' : d3 ? 'done' : 'open', sum3, b3,
    'Choose the ' + (!sel.cat ? 'type' : isW ? 'weapon type' : !sel.slot ? 'slot' : setWord) + ' first.'));
  return out;
}

function rollFields(o, info, isOdds, rerender){

  'armor damage':'Damage to Armor', 'dmg to armor':'Damage to Armor', 'armor regen':'Armor Regeneration', 'crit chance':'Critical Hit Chance',
  'crit damage':'Critical Hit Damage', 'headshot dmg':'Headshot Damage'};

  'mods', 'dye', 'appearance', 'brand set', 'gear set', 'proficient', 'damage drop off'];

const vNorm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'")

/* OCR lines ({t, x, y, w, h, a}) → text rows top to bottom. ML Kit splits a row like "+13.2%   SMG Damage" into

function ocrRows(lines){
  const ls = (lines || []).filter(l => l && typeof l.t === 'string' && l.t.trim());
  if (!ls.length) return [];
  const angles = ls.filter(l => l.w > 80 && typeof l.a === 'number').map(l => l.a).sort((a, b) => a - b);

function videoItem(seg, section){

function videoItems(segments, section){

/* ================= 2) ODDS ================= */
/* The odds are conditional: given that this exact item dropped, how likely is the roll you want?
   Each part is estimated in layers, from the narrowest group of drops to the widest:
     p(level) = (times seen in this level + K · p(wider level)) / (drops in this level + K),  K = number of options
   and the widest level falls back to equal odds (1 / K). With no data, this is the theoretical value.
   Each drop counts only once: a level holds the drops of its group that aren't already in a narrower level. */
function hier(v, pool, levels){
  if (!pool.includes(v)) return 0;
  const K = pool.length;
  let p = 1 / K;
  for (let i = levels.length - 1; i >= 0; i--){
    const c = levels[i] || {};
    let n = 0; for (const x of pool) n += c[x] || 0;
    p = ((c[v] || 0) + K * p) / (n + K);
  }
  return p;
}
function distOf(pool, levels){ const m = {}; for (const v of pool) m[v] = hier(v, pool, levels); return m; }
function countsOf(drops, getter){ const m = {}; for (const d of drops){ const v = getter(d); if (Array.isArray(v)) v.forEach(x => inc(m, x)); else inc(m, v); } return m; }
/* Chance that an item with `slots` attribute slots (distinct, drawn without repeats) has all `want` attributes */
function attrsProb(slots, want, d){
  if (!want.length) return 1;
  if (want.some(a => !(a in d))) return 0;
  if (slots === 1) return want.length === 1 ? d[want[0]] : 0;
  const pool = Object.keys(d);
  if (want.length === 1){
    const a = want[0], pa = d[a];
    let s = pa;
    for (const b of pool){ if (b === a) continue; const pb = d[b]; if (pb < 1) s += pb * pa / (1 - pb); }
    return Math.min(1, s);
  }
  if (want.length === 2){
    const [a, b] = want; if (a === b) return 0;
    const pa = d[a], pb = d[b];
    return (pa < 1 ? pa * pb / (1 - pa) : 0) + (pb < 1 ? pb * pa / (1 - pb) : 0);
  }
  return 0;
}
/* Levels of data used for each part, narrowest first. Groups are nested; each level keeps only the
   drops that aren't in the narrower one, so no drop is counted twice. */
function rings(D, preds, getter){
  return preds.map((P, i) => countsOf(D.filter(d => P(d) && !(i && preds[i - 1](d))), getter));
}
/* Only items whose core is random say anything about how a random core rolls, so drops of items with a native core
   (almost all gear) are left out here. */
function coreLevels(sel, D){
  const k = itemKey(sel), rnd = d => d.cat !== 'weapon' && corePool(d).length > 1;
  return rings(D, [d => rnd(d) && itemKey(d) === k,
                   d => rnd(d) && d.cat === sel.cat && d.set === sel.set,
                   d => rnd(d) && d.cat === sel.cat,
                   rnd], d => d.core);
}
function gearAttrLevels(sel, core, D){
  const k = itemKey(sel);
  return rings(D, [d => d.core === core && itemKey(d) === k,
                   d => d.core === core && d.cat === sel.cat,
                   d => d.core === core && d.cat !== 'weapon',
                   d => d.cat !== 'weapon'], d => d.attrs);
}
function gearTalentLevels(sel, core, D){
  const k = itemKey(sel), b = d => d.cat === 'brand' && d.rarity === HE && d.slot === sel.slot && !!d.talent;
  return rings(D, [d => b(d) && d.core === core && itemKey(d) === k,
                   d => b(d) && d.core === core,
                   b], d => d.talent);
}
function weaponAttrLevels(sel, D){
  const k = itemKey(sel);
  return rings(D, [d => itemKey(d) === k, d => d.cat === 'weapon' && d.slot === sel.slot, d => d.cat === 'weapon'], d => d.attrs);
}
/* Weapon talents: this item, then every weapon whose talent rolls at random (High End and the Named in STAT_ONLY_NAMED).
   Drops without a recorded talent (First Sight logged before 2.1.2) are left out. */
function weaponTalentLevels(sel, D){
  const k = itemKey(sel), w = d => d.cat === 'weapon' && (d.rarity === HE || statOnlyNamed(d)) && !!d.talent;
  return rings(D, [d => w(d) && itemKey(d) === k, w], d => d.talent);
}
/* Main calculation. Returns {p, parts:[{core, pc, pa, pt, p}]} (one part per core; weapons have a single part) */
function odds(sel, want, D){
  const info = itemInfo(sel);
  if (info.sameRoll){   // nothing random (Core Strength backpack, Turmoil): the roll is always the same
    const pf = want.attrs.length || (want.talent !== ANY) ? 0 : 1;
    return {p: pf, parts: [{core: info.fixedCore, pc: 1, pa: pf, pt: 1, p: pf}]};
  }
  if (!info.hasCore){
    const pa = attrsProb(1, want.attrs, distOf(info.attrPool, weaponAttrLevels(sel, D)));
    const pt = want.talent === ANY || !info.talentPool.length ? 1 : hier(want.talent, info.talentPool, weaponTalentLevels(sel, D));
    return {p: pa * pt, parts: [{core: null, pc: 1, pa, pt, p: pa * pt}]};
  }
  const pool = info.corePool, cores = want.core === ANY ? pool : [want.core];
  const parts = cores.map(core => {
    const pc = !pool.includes(core) ? 0 : pool.length === 1 ? 1 : hier(core, CORES, coreLevels(sel, D));
    const pa = attrsProb(info.attrSlots, want.attrs, distOf(info.attrPool, gearAttrLevels(sel, core, D)));
    const pt = want.talent === ANY || !info.talentPool.length ? 1 : hier(want.talent, info.talentPool, gearTalentLevels(sel, core, D));
    return {core, pc, pa, pt, p: pc * pa * pt};
  });
  return {p: parts.reduce((a, x) => a + x.p, 0), parts};
}

  if (want.core !== ANY && d.core !== want.core) return false;
  for (const a of want.attrs) if (!(d.attrs || []).includes(a)) return false;
  if (want.talent !== ANY && d.talent !== want.talent) return false;
  return true;
}

        h('li', {}, 'Exceptions among Named gear: ' + NAMED_GEAR_ROLLS.filter(x => x.fixed).map(x => x.named + ' comes with ' + x.fixed.join(' and ') + ' already rolled').join('; ') +
          '; ' + NAMED_GEAR_ROLLS.filter(x => x.exclude).map(x => x.named + ' can’t roll ' + x.exclude.join(', ')).join(', ') + ' as its free attribute.'),
        h('li', {}, 'Exception: ' + STAT_ONLY_NAMED.map(x => x.named).join(', ') + ' only changes the weapon’s base stats, so it rolls an attribute and a talent like a High End weapon of its type. Its talents also count toward the High End weapon talent estimate.'),
        h('li', {}, 'Exception: the Core Strength backpack always has all three core attributes and no minor attributes, so it rolls the same every time. Its drops aren’t used to estimate other items’ cores or attributes.'),
        h('li', {}, 'Parts are multiplied, assuming each one rolls independently. Targeted loot and the activity can change real odds, so logging drops from the same source keeps comparisons fair.')))));
}

/* ================= 3) HISTORY & BACKUP ================= */
let histFilter = 'all', histLimit = 100, histPanel = null;
function renderHist(){
  const root = $('#hist');
  root.replaceChildren();
  const N = S.drops.length, by = c => S.drops.filter(d => d.cat === c).length;

    (n => n ? h('p', {class:'small warn', style:'margin:10px 0 0'}, plural(n, 'drop') + ' logged with a core ' + (n === 1 ? 'its item' : 'their items') +
      ' can’t drop with (marked “Core should be…” below). Check the brand or set: delete and log ' + (n === 1 ? 'it' : 'them') + ' again if it was a slip.') : null)(gearDrops.filter(offCore).length),
    BASE ? h('p', {class:'small muted', style:'margin:10px 0 0'}, 'The app includes ' + plural(BASE.drops.length, 'base drop') + ' (' + BASE.label + '). They aren’t listed here and ' +
      (S.useBase ? 'are' : 'currently aren’t') + ' used for the odds (switch it in Odds).') : null));

  const since = S.drops.filter(d => d.ts > S.backupTs).length;
  const backup = card(NATIVE ? 'Data & backup' : 'Backup');
  if (NATIVE && db.hasFile){
    backup.append(h('div', {class:'dbline'},
      h('div', {}, h('div', {class:'small muted'}, 'Database'), h('div', {class:'name'}, db.name || '.json file')),

    if (histPanel === 'db') backup.append(h('div', {class:'panel', style:'margin:0 0 12px'},

      }}, 'Open another file'),

  }
  backup.append(
    h('p', {class:'small ' + (since >= 25 ? 'warn' : 'muted'), style:'margin:0 0 10px'},
      S.backupTs ? plural(since, 'new drop') + ' since your last backup.' : (N ? 'You haven’t made a backup yet.' :
        (NATIVE ? 'Save a copy now and then (to Drive, for example) in case you lose your phone.' : 'Data is saved in this browser. Make backups now and then.'))),
    h('div', {class:'btn-grid'},

      h('button', {type:'button', class:'btn', onclick: () => { if (NATIVE) nCall('importFile'); else $('#file').click(); }}, 'Import file'),
      h('button', {type:'button', class:'btn', onclick: () => { histPanel = histPanel === 'copy' ? null : 'copy'; renderHist(); }}, 'Copy as text'),
      h('button', {type:'button', class:'btn', onclick: () => { histPanel = histPanel === 'paste' ? null : 'paste'; renderHist(); }}, 'Paste backup'),
      h('button', {type:'button', class:'btn', onclick: exportCSV}, 'Export CSV'),

  if (histPanel === 'copy'){

    backup.append(h('div', {class:'panel'}, ta,
      h('button', {type:'button', class:'btn primary block', style:'margin-top:8px', onclick: () => copyText(ta)}, 'Copy to clipboard'),
      h('p', {class:'small muted'}, 'Paste this text into a note or message to keep it. Restore it later with "Paste backup".')));
  } else if (histPanel === 'paste'){

  const list = S.drops.filter(d => histFilter === 'all' || d.cat === histFilter).slice().sort((a, b) => b.ts - a.ts);
  const wrap = h('div', {});

function dropPerk(d){
  const n = findNamed(d);
  if (n) return n.perk;
  if (d.cat === 'gear' && TALENT_SLOTS.includes(d.slot)) return 'Gear Set talent';
  return null;
}
function dropItem(d){
  const time = d.ts ? new Date(d.ts).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  const tags = h('div', {class:'tags'});
  const t = (txt, c, cls) => h('span', {class:'tag' + (cls ? ' ' + cls : '')}, dot(c), txt);
  for (const c of allCoresItem(d) ? CORES : d.core ? [d.core] : []) tags.append(t(c, COLOR[c]));
  (d.attrs || []).forEach(a => tags.append(t(a, COLOR[a])));
  const rule = namedRule(d);
  if (rule && rule.fixed) rule.fixed.forEach(a => tags.append(t(a, COLOR[a])));
  if (d.talent) tags.append(t(d.talent, null, 'talent'));
  const perk = dropPerk(d);
  if (perk) tags.append(t(perk, null, 'perk-tag'));
  const nat = offCore(d);
  if (nat) tags.append(t('Core should be ' + nat, null, 'warn-tag'));
  return h('div', {class:'drop'},
    h('div', {class:'drop-top'},
      h('div', {}, h('div', {class:'drop-title'}, itemName(d)), h('div', {class:'drop-sub'}, itemSub(d) + (time ? ' · ' + time : ''))),
      h('button', {type:'button', class:'icon-btn', 'aria-label':'Delete drop', onclick: () => {
        if (!confirm('Delete this drop?')) return;
        S.drops = S.drops.filter(x => x.id !== d.id); persist(); renderHist();
      }}, '×')),
    tags,
    d.note ? h('div', {class:'small muted', style:'margin-top:6px'}, d.note) : null);
}
function backupText(){ return JSON.stringify({app:'td2-drop-tracker', v:3, exported:new Date().toISOString(), catalog:S.catalog, drops:S.drops}); }
function stamp(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); }
function download(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = h('a', {href:url, download:name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function markBackup(){ S.backupTs = Date.now(); persist(); }
function exportJSON(){
  if (NATIVE){ pendingBackup = true; nCall('exportFile', 'td2-drops-backup-' + stamp() + '.json', 'application/json', backupText()); return; }
  download('td2-drops-backup-' + stamp() + '.json', backupText(), 'application/json'); markBackup(); renderHist(); toast('Backup exported');
}
function exportCSV(){
  const esc = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['date','type','set','slot','rarity','named','core','attribute_1','attribute_2','talent','unique_perk','note'];
  const lines = [head.join(',')];
  for (const d of S.drops.slice().sort((a, b) => a.ts - b.ts)){
    const rule = namedRule(d), at = (d.attrs || []).length ? d.attrs : rule && rule.fixed ? rule.fixed : [];
    lines.push([d.ts ? new Date(d.ts).toISOString() : '', CAT_LABEL[d.cat], d.set || '', d.slot, d.rarity, d.named || '', allCoresItem(d) ? CORES.join(' + ') : d.core || '',
      at[0] || '', at[1] || '', d.talent || '', dropPerk(d) || '', d.note || ''].map(esc).join(','));
  }
  const csv = '﻿' + lines.join('\n');
  if (NATIVE){ pendingBackup = false; nCall('exportFile', 'td2-drops-' + stamp() + '.csv', 'text/csv', csv); return; }
  download('td2-drops-' + stamp() + '.csv', csv, 'text/csv');
}
function copyText(ta){
  const done = () => { markBackup(); toast('Copied to clipboard'); };
  if (NATIVE){ if (nCall('copy', ta.value) === 'ok') done(); else fallbackCopy(ta, done); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => fallbackCopy(ta, done));
  else fallbackCopy(ta, done);
}
function fallbackCopy(ta, done){
  ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  ta.setAttribute('readonly', '');
  if (ok) done(); else toast('Select the text and copy it manually');
}
function importData(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('That text isn’t a valid backup.'); return false; }
  const arr = Array.isArray(d) ? d : d && d.drops;
  if (!Array.isArray(arr)){ alert('That backup has no drops.'); return false; }
  const ids = new Set(S.drops.map(x => x.id));
  let added = 0;
  for (const x of migrateAll(arr)){
    if (ids.has(x.id)) continue;
    S.drops.push(x); ids.add(x.id); added++;
  }
  S.drops.sort((a, b) => a.ts - b.ts);
  if (d && d.catalog && (d.catalog.v === 3 || d.catalog.v === CATALOG_V) && confirm('The backup includes a catalog. Replace your current catalog with it?')){ S.catalog = normalizeCatalog(d.catalog); resetSelections(); }
  persist();
  toast(plural(added, 'drop') + ' imported');
  return true;
}
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { importData(String(rd.result)); renderView(); };
  rd.readAsText(f);
  e.target.value = '';
});
function clearAll(){
  if (!S.drops.length) return;
  if (!confirm('Delete all ' + plural(S.drops.length, 'drop') + '? This can’t be undone.')) return;
  if (!confirm('Please confirm again: every drop will be deleted.')) return;
  S.drops = []; persist(); renderHist(); toast('Drops deleted');
}

/* ================= 4) CATALOG ================= */
let CW = null;
function markDirty(){ catDirty = true; const b = $('#catsave'); if (b) b.disabled = false; }
function listArea(get, set, rows){
  const ta = h('textarea', {rows: String(rows || 6), spellcheck:'false'});
  ta.value = get().join('\n');
  ta.addEventListener('input', () => { set(parseLines(ta.value)); markDirty(); });
  return ta;
}
function lineArea(get, set, rows){
  const ta = h('textarea', {rows: String(rows || 8), spellcheck:'false', class:'mono'});
  ta.value = get();
  ta.addEventListener('input', () => { set(ta.value); markDirty(); });
  return ta;
}
/* Sets are edited as "Name | Core" lines. A Gear Set split by slot: "Name | Mask, Gloves, Holster: Weapon Damage; Chest, Backpack, Kneepads: Armor".
   No core (or "random") means the core is random. */
function slotCoresText(v){
  const by = {};
  for (const s of GEAR_SLOTS) if (v[s]) (by[v[s]] = by[v[s]] || []).push(s);
  return Object.keys(by).map(c => by[c].join(', ') + ': ' + c).join('; ');
}
const brToText = c => c.brands.map(n => c.brandCores[n] ? n + ' | ' + c.brandCores[n] : n).join('\n');
const gsToText = c => c.gearSets.map(n => { const v = c.setCores[n]; return !v ? n : n + ' | ' + (typeof v === 'string' ? v : slotCoresText(v)); }).join('\n');
function parseCore(t){
  const x = t.trim().toLowerCase();
  if (!x || x === 'random') return {ok: true, v: null};
  const c = CORES.find(k => k.toLowerCase() === x);
  return c ? {ok: true, v: c} : {ok: false};
}
function parseSets(text, bySlot){
  const names = [], cores = {}, bad = [];
  for (const line of text.split(/\r?\n/)){
    if (!line.trim()) continue;
    const i = line.indexOf('|'), n = (i < 0 ? line : line.slice(0, i)).trim(), rest = i < 0 ? '' : line.slice(i + 1).trim();
    if (!n){ bad.push(line); continue; }
    if (names.includes(n)) continue;
    if (bySlot && rest.includes(':')){
      const m = {}; let good = true;
      for (const part of rest.split(';')){
        if (!part.trim()) continue;
        const j = part.indexOf(':'), pc = parseCore(part.slice(j + 1));
        const slots = part.slice(0, j).split(',').map(s => s.trim()).filter(Boolean).map(s => GEAR_SLOTS.find(g => g.toLowerCase() === s.toLowerCase()));
        if (j < 0 || !slots.length || slots.includes(undefined) || !pc.ok || !pc.v){ good = false; break; }
        for (const s of slots) m[s] = pc.v;
      }
      if (!good){ bad.push(line); continue; }
      names.push(n); cores[n] = m;   // slots left out roll a random core
    } else {
      const pc = parseCore(rest);
      if (!pc.ok){ bad.push(line); continue; }
      names.push(n); if (pc.v) cores[n] = pc.v;
    }
  }
  return {names, cores, bad};
}
const ngToText = l => l.map(x => [x.n, x.set, x.slot, x.perk].join(' | ')).join('\n');
const nwToText = l => l.map(x => [x.n, x.type, x.perk, x.base].join(' | ').replace(/ \| $/, '')).join('\n');
function parseNamed(text, kind){
  const ok = [], bad = [];
  for (const line of text.split(/\r?\n/)){
    if (!line.trim()) continue;
    const p = line.split('|').map(s => s.trim());
    if (kind === 'gear'){
      if (p.length >= 3 && p[0] && p[1] && GEAR_SLOTS.includes(p[2])) ok.push({n:p[0], set:p[1], slot:p[2], perk:p[3] || 'Unique perk'}); else bad.push(line);
    } else {
      const type = T_ABBR[p[1]] || p[1];
      if (p.length >= 2 && p[0] && WEAPON_TYPES.includes(type)) ok.push({n:p[0], type, perk:p[2] || 'Unique talent', base:p[3] || ''}); else bad.push(line);
    }
  }
  return {ok, bad};
}
function renderCatalog(){
  if (!catDirty || !CW) CW = Object.assign(clone(S.catalog), {brText: brToText(S.catalog), gsText: gsToText(S.catalog),
    ngText: ngToText(S.catalog.namedGear), nwText: nwToText(S.catalog.namedWeapons)});
  const root = $('#catalog');
  root.replaceChildren();
  root.append(h('p', {class:'small muted', style:'margin:12px 2px 0'},
    'Preloaded with the game’s sets, attributes, talents and Named items (up to Red Horizon). Edit them if a season adds or changes something: one item per line. Renaming something doesn’t change drops you already logged.'));
  root.append(card('Sets',
    h('p', {class:'small muted', style:'margin:0'}, 'One per line: Name | Core attribute (' + CORES.join(', ') + '). Every item of that brand or set drops with that core. Leave the core out if it’s random. A Gear Set split by slot: Name | Mask, Gloves, Holster: Weapon Damage; Chest, Backpack, Kneepads: Armor.'),
    field('Brand Sets', lineArea(() => CW.brText, v => { CW.brText = v; }, 8)),
    field('Gear Sets', lineArea(() => CW.gsText, v => { CW.gsText = v; }, 8))));
  root.append(card('Attributes',
    field('Gear attributes', listArea(() => CW.gearAttrs, v => { CW.gearAttrs = v; }, 8)),
    field('Weapon attributes', listArea(() => CW.weaponAttrs, v => { CW.weaponAttrs = v; }, 8), 'the weapon’s core 2 is excluded')));
  root.append(card('Gear talents (Brand High End)',
    h('p', {class:'small muted', style:'margin:0'}, 'Gear Set chests and backpacks always have the set’s own talent, so they aren’t listed.'),
    field('Chest', listArea(() => CW.chestTalents, v => { CW.chestTalents = v; }, 7)),
    field('Backpack', listArea(() => CW.backpackTalents, v => { CW.backpackTalents = v; }, 7))));

  const wtCard = card('Weapon talents (High End)');
  wtCard.append(h('p', {class:'small muted', style:'margin:0 0 6px'}, 'Tick the weapon types each talent can roll on.'));
  const wtList = h('div', {});
  wtCard.append(wtList);
  CW.weaponTalents.sort((a, b) => coll(a.n, b.n));
  renderWTalents(wtList);
  const newIn = h('input', {type:'text', placeholder:'New talent'});
  wtCard.append(h('div', {class:'wt-top', style:'margin-top:10px'}, newIn,
    h('button', {type:'button', class:'btn', onclick: () => {
      const n = newIn.value.trim(); if (!n) return;
      CW.weaponTalents.push({n, w: WEAPON_TYPES.slice()}); newIn.value = ''; markDirty(); renderWTalents(wtList);
    }}, 'Add')));
  root.append(wtCard);

  root.append(card('Named gear',
    h('p', {class:'small muted', style:'margin:0'}, 'One per line: Name | Brand | Slot | Unique attribute or perfect talent. Slot: ' + GEAR_SLOTS.join(', ') + '. On chests and backpacks the last field is the talent; on other slots it’s the unique attribute.'),
    field('Items', lineArea(() => CW.ngText, v => { CW.ngText = v; }, 10), plural(CW.namedGear.length, 'item'))));
  root.append(card('Named weapons',
    h('p', {class:'small muted', style:'margin:0'}, 'One per line: Name | Type | Unique talent | Base weapon. Type: ' + WEAPON_TYPES.join(', ') + ' (or AR, MMR, SMG, LMG, SG, RIF, PIS).'),
    field('Items', lineArea(() => CW.nwText, v => { CW.nwText = v; }, 10), plural(CW.namedWeapons.length, 'item'))));

  root.append(h('div', {class:'actionbar'},
    h('button', {type:'button', class:'btn primary block', id:'catsave', disabled: !catDirty, onclick: saveCatalog}, 'Save catalog'),
    h('button', {type:'button', class:'btn block', style:'margin-top:8px', onclick: () => {
      if (!confirm('Restore the original catalog? Your drops aren’t deleted.')) return;
      S.catalog = clone(DEFAULT_CATALOG); catDirty = false; CW = null; resetSelections(); persist(); renderCatalog(); toast('Catalog restored');
    }}, 'Restore defaults')));
}
function renderWTalents(container){
  container.replaceChildren();
  for (const t of CW.weaponTalents){
    const name = h('input', {type:'text', value:t.n, 'aria-label':'Talent name', oninput: e => { t.n = e.target.value.trim(); markDirty(); }});
    const del = h('button', {type:'button', class:'icon-btn', 'aria-label':'Remove talent', onclick: () => {
      CW.weaponTalents.splice(CW.weaponTalents.indexOf(t), 1); markDirty(); renderWTalents(container);
    }}, '×');
    const mini = h('div', {class:'mini'});
    for (const s of WEAPON_TYPES){
      const b = h('button', {type:'button', class:'mchip', 'aria-pressed': t.w.includes(s) ? 'true' : 'false', onclick: () => {
        const j = t.w.indexOf(s); if (j >= 0) t.w.splice(j, 1); else t.w.push(s);
        b.setAttribute('aria-pressed', t.w.includes(s) ? 'true' : 'false'); markDirty();
      }}, W_SHORT[s]);
      mini.append(b);
    }
    container.append(h('div', {class:'wt-row'}, h('div', {class:'wt-top'}, name, del), mini));
  }
}
function saveCatalog(){
  const g = parseNamed(CW.ngText, 'gear'), w = parseNamed(CW.nwText, 'weapon');
  const br = parseSets(CW.brText, false), gs = parseSets(CW.gsText, true);
  const badSets = br.bad.concat(gs.bad), badNamed = g.bad.concat(w.bad);
  if (badSets.length && !confirm(plural(badSets.length, 'set line') + ' couldn’t be read (check the core: ' + CORES.join(', ') + ') and will be skipped:\n\n' + badSets.slice(0, 6).join('\n') + '\n\nSave anyway?')) return;
  if (badNamed.length && !confirm(plural(badNamed.length, 'Named line') + ' couldn’t be read (check the slot or type) and will be skipped:\n\n' + badNamed.slice(0, 6).join('\n') + '\n\nSave anyway?')) return;
  const next = Object.assign({}, CW, {namedGear: g.ok, namedWeapons: w.ok});
  if (br.names.length) Object.assign(next, {brands: br.names, brandCores: br.cores});
  if (gs.names.length) Object.assign(next, {gearSets: gs.names, setCores: gs.cores});
  delete next.ngText; delete next.nwText; delete next.brText; delete next.gsText;
  next.weaponTalents = next.weaponTalents.filter(t => t.n);
  next.v = CATALOG_V;
  S.catalog = normalizeCatalog(next);
  catDirty = false; CW = null;
  resetSelections();
  persist();
  renderCatalog();
  toast('Catalog saved');
}
window.addEventListener('beforeunload', e => { if (catDirty){ e.preventDefault(); e.returnValue = ''; } });

/* ================= Start ================= */
if (NATIVE) nativeLoad(); else load();
updateChrome();
renderView();
})();
