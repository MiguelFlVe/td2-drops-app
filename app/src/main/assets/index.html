<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1013">
<title>Drops TD2</title>
<style>
:root{
  --bg:#0e1013; --surface:#171a1f; --surface2:#1f232a; --border:#2b3039; --text:#e9ebef; --muted:#97a0ad;
  --accent:#ff7417; --accent-ink:#1b0c00; --accent-soft:rgba(255,116,23,.14);
  --red:#f0564f; --blue:#4d8dff; --yellow:#efc23a; --gold:#e8b44c; --gold-soft:rgba(232,180,76,.12); --ok:#39c58a; --danger:#f0564f;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f4f6; --surface:#ffffff; --surface2:#f0f2f5; --border:#d8dce2; --text:#14171c; --muted:#5b6370;
    --accent:#e2600a; --accent-ink:#ffffff; --accent-soft:rgba(226,96,10,.12);
    --red:#d63c35; --blue:#2f6fe0; --yellow:#b88a00; --gold:#9a6b00; --gold-soft:rgba(184,138,0,.10); --ok:#1f9a65; --danger:#d63c35; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.brandmark{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:12px}
.t1{font-weight:800;letter-spacing:.02em}
.t2{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.field{margin:14px 0}
.field:first-child{margin-top:2px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;line-height:1.15;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.cols-2{display:grid;grid-template-columns:1fr 1fr}
.chips.cols-3{display:grid;grid-template-columns:repeat(3,1fr)}
.chip{min-height:42px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-size:14px;text-align:left;line-height:1.2;display:flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.chip.any{color:var(--muted)}
.chip.any[aria-pressed="true"]{color:var(--text)}
.chip:disabled{opacity:.4}
.c-red{background:var(--red)} .c-blue{background:var(--blue)} .c-yellow{background:var(--yellow)}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:16px;width:100%;min-height:44px;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px}
textarea{line-height:1.4;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.fixed{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:8px 12px}
.fixed-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.fixed-row .k{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.perk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--gold);background:var(--gold-soft);font-size:14px}
.perk svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--gold)}
.perk small{display:block;color:var(--muted);font-size:12px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actionbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:10px 0 4px;margin-top:4px}
.actionbar .missing{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0}
.step.locked{opacity:.55}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step.locked .step-h{margin-bottom:4px}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface2);border:1px solid var(--border);flex:none}
.step.done .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step-s{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked-hint{font-size:13px;color:var(--muted);padding-left:34px}
.sub-lbl{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px 10px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:20;
  background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;padding:4px}
.banner{margin:12px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--yellow);background:rgba(239,194,58,.12);font-size:13px}
.banner .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .acts .btn{min-height:38px;padding:6px 12px;font-size:13px}
.big{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .v small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal}
table.bd{width:100%;border-collapse:collapse;font-size:13px}
table.bd th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border)}
table.bd td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums}
table.bd td.num,table.bd th.num{text-align:right;white-space:nowrap}
table.bd td small{display:block;color:var(--muted)}
table.bd tr.total td{font-weight:800;border-bottom:0}
details{margin-top:4px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
details p,details li{font-size:13px;color:var(--muted)}
details ul{padding-left:18px;margin:6px 0}
.inline{display:flex;align-items:center;gap:10px}
.inline input{width:96px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.drop{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.drop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drop-title{font-weight:700}
.drop-sub{font-size:13px;color:var(--muted)}
.drop-time{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.talent{border-color:var(--accent);color:var(--accent)}
.tag.perk-tag{border-color:var(--gold);color:var(--gold)}
.tag.rar{font-weight:700}
.icon-btn{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted)}
.wt-row{border-top:1px solid var(--border);padding:10px 0}
.wt-row:first-child{border-top:0}
.wt-top{display:flex;gap:8px;align-items:center}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.mchip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.panel{margin-top:10px}
.panel textarea,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.warn{color:var(--yellow)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.basetoggle{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin:10px 0 0;cursor:pointer}
.basetoggle input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.basetoggle b{display:block;font-size:14px}
.basetoggle small{display:block;color:var(--muted);font-size:12px}
.corelist{display:grid;gap:8px}
.corerow{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.corerow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.corerow .cr-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;line-height:1.2}
.corerow .cr-p{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.corerow small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.corerow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.onboard{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.onboard .box{max-width:420px;width:100%}
.onboard .logo{width:56px;height:56px;border-radius:14px;font-size:18px;margin-bottom:18px}
.onboard h1{font-size:22px;line-height:1.25;margin:0 0 8px}
.onboard p{color:var(--muted);margin:0 0 18px}
.onboard .btn{margin-top:10px}
.dbline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px}
.dbline .name{font-weight:700;word-break:break-all}
.dbline .btn{min-height:36px;padding:6px 12px;font-size:13px;flex:none}
@media (max-width:360px){ .chips.cols-3{grid-template-columns:1fr 1fr} .big{font-size:36px} .stat b{font-size:18px} }
</style>
</head>
<body>
<header class="app">
  <div class="wrap bar">
    <div class="brandmark">
      <div class="logo">TD2</div>
      <div><div class="t1">Drops TD2</div><div class="t2">Drop log &amp; roll odds</div></div>
    </div>
    <span id="count" class="pill">0 drops</span>
  </div>
</header>
<div class="wrap"><div id="banner" class="banner" hidden></div></div>
<main class="wrap">
  <section class="view" data-view="log"><div id="log"></div></section>
  <section class="view" data-view="odds" hidden><div id="odds-form"></div><div id="odds-results"></div></section>
  <section class="view" data-view="hist" hidden><div id="hist"></div></section>
  <section class="view" data-view="cat" hidden><div id="catalog"></div></section>
</main>
<div id="onboard" class="onboard" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-go="log" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Log drop</button>
    <button type="button" data-go="odds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Odds</button>
    <button type="button" data-go="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>History</button>
    <button type="button" data-go="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Catalog</button>
  </div>
</nav>

<!-- Base data bundled with the app (optional). If the file is missing, the app works the same. -->
<script src="base-data.js" onerror="window.TD2_BASE = null"></script>
<script>
(function(){

  weaponTalents: [
    WT('Breadbasket'), WT('Close & Personal'), WT('Eyeless'), WT('Fast Hands'), WT('Flatline'), WT('Future Perfect'),

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const dot = c => c ? h('span', {class:'dot c-' + c}) : null;

function fmtPct(p){
  if (!isFinite(p) || p <= 0) return '0%';
  const v = p * 100;
  let s;
  if (p >= 1) s = '100';
  else if (v >= 99.95) return '>99.9%';
  else if (v >= 10) s = v.toLocaleString('en-US', {maximumFractionDigits:1});
  else if (v >= 1) s = v.toLocaleString('en-US', {maximumFractionDigits:2});
  else s = v.toLocaleString('en-US', {maximumSignificantDigits:3});
  return s + '%';
}
const fmtInt = n => isFinite(n) ? Math.round(n).toLocaleString('en-US') : '∞';
const fmtNum = (n, d) => (n > 0 && n < 0.01)
  ? n.toLocaleString('en-US', {maximumSignificantDigits: 2})
  : n.toLocaleString('en-US', {maximumFractionDigits: d == null ? 1 : d});
const plural = (n, one, many) => fmtInt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
function needed(p, q){ if (p <= 0) return Infinity; if (p >= 1) return 1; return Math.ceil(Math.log(1 - q) / Math.log(1 - p)); }
function parseLines(t){ const seen = new Set(); return t.split(/\r?\n/).map(s => s.trim()).filter(s => s && !seen.has(s) && seen.add(s)); }
function cleanList(a){ return Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : null; }
function inc(o, k){ if (k == null || k === '') return; o[k] = (o[k] || 0) + 1; }

/* Returns a drop in the current format, or null if it can't be read */
function migrateDrop(d){
  if (!d || typeof d !== 'object') return null;
  if (CATS.includes(d.cat)){
    return {id: d.id || uid(), ts: d.ts || 0, cat: d.cat, set: d.set || null, slot: d.slot || null,
      rarity: d.rarity || (d.cat === 'gear' ? GS : HE), named: d.named || null, core: d.core || null,
      attrs: Array.isArray(d.attrs) ? d.attrs.slice() : [], talent: d.talent || null, note: d.note || undefined};
  }
  const attrs = (Array.isArray(d.minors) ? d.minors : []).map(m => ES.attr[m] || m);
  if (d.cat === 'Equipo'){
    const cat = d.clase === 'Gear' ? 'gear' : 'brand';
    let set = d.set || (cat === 'gear' && d.talent ? d.talent : null);   // v1.0 stored the Gear Set as the talent
    if (set) set = ES.brand[set] || set;
    return {id: d.id || uid(), ts: d.ts || 0, cat, set, slot: ES.slot[d.sub] || d.sub || null, rarity: cat === 'gear' ? GS : HE, named: null,
      core: ES.core[d.core] || d.core || null, attrs, talent: cat === 'brand' ? (d.talent || null) : null, note: d.note || undefined};
  }
  if (d.cat === 'Arma'){
    return {id: d.id || uid(), ts: d.ts || 0, cat: 'weapon', set: null, slot: ES.wtype[d.sub] || d.sub || null, rarity: HE, named: null,
      core: null, attrs, talent: d.talent || null, note: d.note || undefined};
  }
  return null;
}
const migrateAll = arr => (Array.isArray(arr) ? arr : []).map(migrateDrop).filter(d => d && d.slot);

function normalizeCatalog(c){
  const d = clone(DEFAULT_CATALOG);
  if (!c || typeof c !== 'object' || c.v !== 3) return d;   // older (Spanish) catalogs are replaced
  const list = k => cleanList(c[k]) || d[k];
  const out = {v: 3, brands: list('brands'), gearSets: list('gearSets'), gearAttrs: list('gearAttrs'), weaponAttrs: list('weaponAttrs'),
    chestTalents: list('chestTalents'), backpackTalents: list('backpackTalents')};
  out.weaponTalents = Array.isArray(c.weaponTalents)
    ? c.weaponTalents.filter(t => t && typeof t.n === 'string' && t.n.trim()).map(t => ({n: t.n.trim(), w: (Array.isArray(t.w) ? t.w : []).filter(x => WEAPON_TYPES.includes(x))}))
    : d.weaponTalents;
  out.namedGear = Array.isArray(c.namedGear)
    ? c.namedGear.filter(x => x && x.n && x.set && GEAR_SLOTS.includes(x.slot)).map(x => ({n: String(x.n), set: String(x.set), slot: x.slot, perk: String(x.perk || 'Unique perk')}))
    : d.namedGear;
  out.namedWeapons = Array.isArray(c.namedWeapons)
    ? c.namedWeapons.filter(x => x && x.n && WEAPON_TYPES.includes(x.type)).map(x => ({n: String(x.n), type: x.type, perk: String(x.perk || 'Unique talent'), base: String(x.base || '')}))
    : d.namedWeapons;
  return out;
}

/* Base data: drops bundled with the app (assets/base-data.js). Not shown in History, but used for the odds
   while "Include base data" is on. Drops that are also in your own file (same id) are not counted twice. */
const BASE = (() => {
  const b = window.TD2_BASE;
  if (!b || !Array.isArray(b.drops)) return null;
  const drops = migrateAll(b.drops);
  return drops.length ? {label: typeof b.label === 'string' && b.label.trim() ? b.label.trim() : 'Base data', drops} : null;
})();
function estDrops(){
  if (!BASE || !S.useBase) return S.drops;
  const own = new Set(S.drops.map(d => d.id));
  return S.drops.concat(BASE.drops.filter(d => !own.has(d.id)));
}

function applyData(d){
  const before = JSON.stringify(S.catalog);
  S.useBase = !(d && d.settings && d.settings.useBase === false);
  S.drops = migrateAll(d && d.drops);
  S.catalog = d && d.catalog ? normalizeCatalog(d.catalog) : clone(DEFAULT_CATALOG);
  S.backupTs = (d && d.backupTs) || 0;
  return JSON.stringify(S.catalog) !== before;   // true if the catalog changed
}

  return JSON.stringify({app:'td2-drop-tracker', v:3, updated:new Date().toISOString(), backupTs:S.backupTs,

function isDbData(d){ return !!d && typeof d === 'object' && !Array.isArray(d) && (Array.isArray(d.drops) || d.app === 'td2-drop-tracker'); }
function parseDb(text){ try{ const d = JSON.parse(text); return isDbData(d) ? d : null; }catch(e){ return null; } }

/* ---- Android bridge ---- */
function nCall(fn, ...a){ try{ return window.AndroidDB[fn](...a); }catch(e){ return null; } }
function nJSON(fn, ...a){ const r = nCall(fn, ...a); try{ return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function nativeStatus(){ db = nJSON('status') || {hasFile:false, name:''}; }
function loadCacheInto(){ const d = parseDb(nCall('loadCache') || ''); if (d) applyData(d); }
function nativeLoad(){
  nativeStatus();
  dbBlocked = false; dbError = '';
  if (!db.hasFile){ loadCacheInto(); return; }
  const r = nJSON('load') || {ok:false, error:'unknown error'};
  if (!r.ok){
    dbBlocked = true;
    dbError = 'Couldn’t open ' + (db.name || 'your data file') + ' (was it moved or deleted?). You’re seeing the app’s internal copy: pick the file again or create a new one.';
    loadCacheInto(); return;
  }
  const text = r.text || '';
  if (!text.trim()){ loadCacheInto(); persist(); return; }
  const d = parseDb(text);
  if (!d){
    dbBlocked = true;
    dbError = (db.name || 'The file') + ' isn’t a valid Drops TD2 database, so it won’t be changed. You’re seeing the app’s internal copy.';
    loadCacheInto(); return;
  }
  applyData(d); lastText = text; nCall('saveCache', text);
}
function nativePick(mode){ nCall(mode === 'create' ? 'createDb' : 'openDb'); }

window.__dbReady = function(mode){
  const wasBlocked = dbBlocked, before = S.drops.slice();
  nativeStatus();
  if (mode === 'created'){
    dbBlocked = false; persist();
    toast('Database created: ' + db.name);
  } else {
    const r = nJSON('load');
    const text = r && r.ok ? (r.text || '') : null;
    const d = text && text.trim() ? parseDb(text) : null;
    if (text === null){ alert('Couldn’t read that file.'); nCall('revert'); nativeStatus(); }
    else if (!text.trim()){ dbBlocked = false; persist(); toast('Empty file: your current data was saved to it'); }
    else if (!d){ alert('That file isn’t a Drops TD2 database or backup.'); nCall('revert'); nativeStatus(); }
    else {
      if (applyData(d)) resetSelections();
      lastText = text; dbBlocked = false; storageOK = true; dbError = '';
      if (wasBlocked){
        const ids = new Set(S.drops.map(x => x.id)); let extra = 0;
        for (const x of before) if (x && x.id && !ids.has(x.id)){ S.drops.push(x); extra++; }
        if (extra){ S.drops.sort((a, b) => a.ts - b.ts); persist(); }
        else nCall('saveCache', text);
      } else nCall('saveCache', text);
      toast('Opened ' + db.name + ' (' + plural(S.drops.length, 'drop') + ')');
    }
  }
  updateChrome(); renderView();
};
window.__onResume = function(){
  if (!db.hasFile || dbBlocked) return;
  const r = nJSON('load');
  if (!r || !r.ok){ nativeLoad(); updateChrome(); renderView(); return; }
  if (r.text && r.text.trim() && r.text !== lastText){
    const d = parseDb(r.text);
    if (d){ if (applyData(d)) resetSelections(); lastText = r.text; nCall('saveCache', r.text); updateChrome(); renderView(); toast('Reloaded: the file changed outside the app'); }
  }
};

/* ================= 2) ODDS ================= */
/* The odds are conditional: given that this exact item dropped, how likely is the roll you want?
   Each part is estimated in layers, from the narrowest group of drops to the widest:
     p(level) = (times seen in this level + K · p(wider level)) / (drops in this level + K),  K = number of options
   and the widest level falls back to equal odds (1 / K). With no data, this is the theoretical value.
   Each drop counts only once: a level holds the drops of its group that aren't already in a narrower level. */
function hier(v, pool, levels){
  if (!pool.includes(v)) return 0;
  const K = pool.length;
  let p = 1 / K;
  for (let i = levels.length - 1; i >= 0; i--){
    const c = levels[i] || {};
    let n = 0; for (const x of pool) n += c[x] || 0;
    p = ((c[v] || 0) + K * p) / (n + K);
  }
  return p;
}
function distOf(pool, levels){ const m = {}; for (const v of pool) m[v] = hier(v, pool, levels); return m; }
function countsOf(drops, getter){ const m = {}; for (const d of drops){ const v = getter(d); if (Array.isArray(v)) v.forEach(x => inc(m, x)); else inc(m, v); } return m; }
/* Chance that an item with `slots` attribute slots (distinct, drawn without repeats) has all `want` attributes */
function attrsProb(slots, want, d){
  if (!want.length) return 1;
  if (want.some(a => !(a in d))) return 0;
  if (slots === 1) return want.length === 1 ? d[want[0]] : 0;
  const pool = Object.keys(d);
  if (want.length === 1){
    const a = want[0], pa = d[a];
    let s = pa;
    for (const b of pool){ if (b === a) continue; const pb = d[b]; if (pb < 1) s += pb * pa / (1 - pb); }
    return Math.min(1, s);
  }
  if (want.length === 2){
    const [a, b] = want; if (a === b) return 0;
    const pa = d[a], pb = d[b];
    return (pa < 1 ? pa * pb / (1 - pa) : 0) + (pb < 1 ? pb * pa / (1 - pb) : 0);
  }
  return 0;
}
/* Levels of data used for each part, narrowest first. Groups are nested; each level keeps only the
   drops that aren't in the narrower one, so no drop is counted twice. */
function rings(D, preds, getter){
  return preds.map((P, i) => countsOf(D.filter(d => P(d) && !(i && preds[i - 1](d))), getter));
}
function coreLevels(sel, D){
  const k = itemKey(sel);
  return rings(D, [d => itemKey(d) === k,
                   d => d.cat === sel.cat && d.set === sel.set,
                   d => d.cat === sel.cat,
                   d => d.cat !== 'weapon'], d => d.core);
}
function gearAttrLevels(sel, core, D){
  const k = itemKey(sel);
  return rings(D, [d => d.core === core && itemKey(d) === k,
                   d => d.core === core && d.cat === sel.cat,
                   d => d.core === core && d.cat !== 'weapon',
                   d => d.cat !== 'weapon'], d => d.attrs);
}
function gearTalentLevels(sel, core, D){
  const k = itemKey(sel), b = d => d.cat === 'brand' && d.rarity === HE && d.slot === sel.slot && !!d.talent;
  return rings(D, [d => b(d) && d.core === core && itemKey(d) === k,
                   d => b(d) && d.core === core,
                   b], d => d.talent);
}
function weaponAttrLevels(sel, D){
  const k = itemKey(sel);
  return rings(D, [d => itemKey(d) === k, d => d.cat === 'weapon' && d.slot === sel.slot, d => d.cat === 'weapon'], d => d.attrs);
}
function weaponTalentLevels(sel, D){
  const k = itemKey(sel), w = d => d.cat === 'weapon' && d.rarity === HE && !!d.talent;
  return rings(D, [d => w(d) && itemKey(d) === k, w], d => d.talent);
}
/* Main calculation. Returns {p, parts:[{core, pc, pa, pt, p}]} (one part per core; weapons have a single part) */
function odds(sel, want, D){
  const info = itemInfo(sel);
  if (!info.hasCore){
    const pa = attrsProb(1, want.attrs, distOf(info.attrPool, weaponAttrLevels(sel, D)));
    const pt = want.talent === ANY || !info.talentPool.length ? 1 : hier(want.talent, info.talentPool, weaponTalentLevels(sel, D));
    return {p: pa * pt, parts: [{core: null, pc: 1, pa, pt, p: pa * pt}]};
  }
  const cores = want.core === ANY ? CORES : [want.core];
  const parts = cores.map(core => {
    const pc = hier(core, CORES, coreLevels(sel, D));
    const pa = attrsProb(info.attrSlots, want.attrs, distOf(info.attrPool, gearAttrLevels(sel, core, D)));
    const pt = want.talent === ANY || !info.talentPool.length ? 1 : hier(want.talent, info.talentPool, gearTalentLevels(sel, core, D));
    return {core, pc, pa, pt, p: pc * pa * pt};

}
function matchesRoll(d, want){

  for (const a of want.attrs) if (!(d.attrs || []).includes(a)) return false;
  if (want.talent !== ANY && d.talent !== want.talent) return false;
  return true;
}

  if (d3) body.append(...rollFields(Q, itemInfo(Q.sel), true, rerender));
  if (BASE) body.append(h('label', {class:'basetoggle'},
    h('input', {type:'checkbox', checked: S.useBase, onchange: e => { S.useBase = e.target.checked; persist(); renderOddsResults(); }}),
    h('span', {}, h('b', {}, 'Include base data'), h('small', {}, BASE.label + ' · ' + plural(BASE.drops.length, 'drop') + ' bundled with the app'))));
  f.append(stepCard(4, 'Roll you want', !d3 ? 'locked' : 'open', '', body, 'Choose the rarity first.'));
}
function renderOddsResults(){
  const box = $('#odds-results');
  box.replaceChildren();
  if (!stepDone(Q.sel, 3)){ box.append(card(null, h('p', {class:'muted', style:'margin:0'}, 'Pick an item in steps 1–3 to see its odds.'))); return; }
  const want = {core: Q.core, attrs: Q.attrs.slice(), talent: Q.talent};
  if (want.core === ANY && !want.attrs.length && want.talent === ANY){
    box.append(card(null, h('p', {class:'muted', style:'margin:0'}, 'Choose the core attribute, attributes or talent you want in step 4.'))); return;
  }
  const sel = Q.sel, info = itemInfo(sel), k = itemKey(sel);
  const own = S.drops, all = estDrops(), NB = all.length - own.length;
  const r = odds(sel, want, all), rT = odds(sel, want, []);
  const p = r.p, pT = rT.p;
  if (!(p > 0)){ box.append(card('Result', h('p', {class:'muted', style:'margin:0'}, 'That roll can’t drop on this item.'))); return; }
  const allItem = all.filter(d => itemKey(d) === k), ownItem = own.filter(d => itemKey(d) === k);
  const ownHits = ownItem.filter(d => matchesRoll(d, want)).length;
  const name = itemName(sel);

  // Main result
  const main = card('Chance once it drops',
    h('div', {class:'big'}, fmtPct(p)),
    h('div', {class:'sub'}, '≈ 1 in ' + fmtInt(1 / p) + ' ' + name + ' drops'),
    h('div', {class:'small muted', style:'margin-top:8px'},
      'If you get a ' + name + ', this is how likely it is to roll what you picked. Based on ' + plural(allItem.length, 'drop') + ' of this item' +
      (info.hasCore ? ' plus similar gear' : ' plus similar weapons') + (NB ? ' (yours + base data).' : '.')),
    kv('Theoretical (all options equally likely)', fmtPct(pT)));
  if (NB) main.append(h('div', {class:'small muted', style:'margin-top:6px'},
    'Includes ' + plural(NB, 'drop') + ' from the base data (' + BASE.label + ') along with your ' + fmtInt(own.length) + '.'));
  if (allItem.length < 10) main.append(h('div', {class:'small warn', style:'margin-top:8px'},
    'Few drops of this exact item yet, so the estimate leans on similar items and the theoretical odds. It sharpens as you log more.'));
  box.append(main);

  // One result per core attribute
  if (info.hasCore){
    const list = h('div', {class:'corelist'});
    for (const core of CORES){
      const rc = odds(sel, Object.assign({}, want, {core}), all), part = rc.parts[0];
      const youN = ownItem.filter(d => d.core === core).length;
      const youK = ownItem.filter(d => matchesRoll(d, Object.assign({}, want, {core}))).length;
      const on = Q.core === core;
      list.append(h('button', {type:'button', class:'corerow', 'aria-pressed': on ? 'true' : 'false',
        onclick: () => { Q.core = on ? ANY : core; renderOdds(); }},
        h('span', {class:'cr-name'}, dot(COLOR[core]), h('span', {}, core, h('small', {}, 'core ' + fmtPct(part.pc) + ' × roll ' + fmtPct(part.pa * part.pt)))),
        h('span', {class:'cr-p'}, fmtPct(rc.p), h('small', {}, 'you: ' + fmtInt(youK) + ' of ' + fmtInt(youN)))));
    }
    box.append(card('By core attribute', list,
      h('p', {class:'small muted', style:'margin:10px 0 0'}, 'Each core is calculated separately: its attributes and talent use only drops with that core. "You": times you got this roll with that core / your drops of this item with that core. Tap a core to see its breakdown' + (Q.core !== ANY ? ' (tap again for Any).' : '.'))));
  }

  // Your drops of this item
  const atLeast = 1 - Math.pow(1 - p, ownItem.length);
  box.append(card('Your drops of this item',
    kv('Drops of this item', fmtInt(ownItem.length)),
    kv('With this roll', fmtInt(ownHits), ownItem.length ? fmtPct(ownHits / ownItem.length) + ' of them' : null),
    kv('Expected with ' + plural(ownItem.length, 'drop'), fmtNum(ownItem.length * p, 2) + ' times'),
    kv('Chance of having it by now', fmtPct(atLeast))));

  // How many more
  const out = h('span', {class:'v'});
  const upd = () => { const m = Math.max(0, Math.floor(nextM || 0)); out.textContent = fmtPct(1 - Math.pow(1 - p, m)); };
  const inp = h('input', {type:'number', inputmode:'numeric', min:'1', value:String(nextM), oninput: e => { nextM = parseInt(e.target.value, 10) || 0; upd(); }});
  upd();
  box.append(card('How many more of this item?',
    kv('For a 50% chance', plural(needed(p, .5), 'drop')),
    kv('For a 90% chance', plural(needed(p, .9), 'drop')),
    kv('On average', plural(1 / p, 'drop')),
    h('div', {class:'kv'}, h('span', {class:'k inline'}, 'In the next', inp, 'drops'), out)));

  // Breakdown
  const tb = h('tbody');
  const row = (label, val, pd, pt, seenK, seenN) => tb.append(h('tr', {},
    h('td', {}, h('b', {}, label), h('small', {}, val)),
    h('td', {class:'num'}, fmtPct(pd), seenN != null ? h('small', {}, fmtInt(seenK) + ' / ' + fmtInt(seenN)) : null),
    h('td', {class:'num'}, fmtPct(pt))));
  if (info.hasCore && want.core === ANY){
    tb.append(h('tr', {}, h('td', {colspan:'3', class:'muted small'}, 'Pick a core above (or in step 4) to see its breakdown.')));
  } else {
    const part = r.parts[0], partT = rT.parts[0];
    const itemD = allItem, itemC = info.hasCore ? itemD.filter(d => d.core === want.core) : itemD;
    if (info.hasCore) row('Core', want.core, part.pc, partT.pc, itemC.length, itemD.length);
    if (want.attrs.length) row(want.attrs.length > 1 ? 'Attributes' : 'Attribute', want.attrs.join(' + '), part.pa, partT.pa,
      itemC.filter(d => want.attrs.every(a => (d.attrs || []).includes(a))).length, itemC.length);
    if (want.talent !== ANY) row('Talent', want.talent, part.pt, partT.pt, itemC.filter(d => d.talent === want.talent).length, itemC.length);
  }
  tb.append(h('tr', {class:'total'}, h('td', {}, 'Total'), h('td', {class:'num'}, fmtPct(p)), h('td', {class:'num'}, fmtPct(pT))));
  box.append(card('Breakdown',
    h('table', {class:'bd'}, h('thead', {}, h('tr', {}, h('th', {}, 'Part'), h('th', {class:'num'}, 'Your data'), h('th', {class:'num'}, 'Theory'))), tb),
    h('p', {class:'small muted', style:'margin:10px 0 0'}, 'Each row is the chance of that part given the ones above. Under each %: times seen / drops of this exact item' +
      (info.hasCore ? ' with that core' : '') + '. Theory assumes every option is equally likely.'),
    h('details', {},
      h('summary', {}, 'How is it calculated?'),
      h('ul', {},
        h('li', {}, 'The odds assume this exact item already dropped (type, set, slot and rarity from steps 1–3) and estimate how likely the roll you picked is.'),
        h('li', {}, 'Each part is estimated in layers: first your drops of this exact item; when there are few, it fills in with similar drops (same set, then same type, then all gear or all weapons), and finally with equal odds for every option. Formula: (times seen + K × wider estimate) ÷ (drops + K), where K is the number of options. Each drop counts only once, in the narrowest group it belongs to.'),
        h('li', {}, 'Gear: the core is estimated per item; attributes and talent are estimated separately for each core.'),
        h('li', {}, 'Brand items roll 2 different attributes (drawn without repeats). Gear Set pieces, weapons and Named gear outside the chest and backpack roll 1.'),
        h('li', {}, 'Named items always come with their unique attribute or perfect talent, so it never counts against you. Gear Set chests and backpacks always have the set talent.'),
        h('li', {}, 'Parts are multiplied, assuming each one rolls independently. Targeted loot and the activity can change real odds, so logging drops from the same source keeps comparisons fair.')))));
}

function dropPerk(d){
  const n = findNamed(d);
  if (n) return n.perk;
  if (d.cat === 'gear' && TALENT_SLOTS.includes(d.slot)) return 'Gear Set talent';
  return null;
}
function dropItem(d){
  const time = d.ts ? new Date(d.ts).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  const tags = h('div', {class:'tags'});
  const t = (txt, c, cls) => h('span', {class:'tag' + (cls ? ' ' + cls : '')}, dot(c), txt);
  if (d.core) tags.append(t(d.core, COLOR[d.core]));
  (d.attrs || []).forEach(a => tags.append(t(a, COLOR[a])));
  if (d.talent) tags.append(t(d.talent, null, 'talent'));
  const perk = dropPerk(d);
  if (perk) tags.append(t(perk, null, 'perk-tag'));
  return h('div', {class:'drop'},
    h('div', {class:'drop-top'},
      h('div', {}, h('div', {class:'drop-title'}, itemName(d)), h('div', {class:'drop-sub'}, itemSub(d) + (time ? ' · ' + time : ''))),
      h('button', {type:'button', class:'icon-btn', 'aria-label':'Delete drop', onclick: () => {
        if (!confirm('Delete this drop?')) return;
        S.drops = S.drops.filter(x => x.id !== d.id); persist(); renderHist();
      }}, '×')),
    tags,
    d.note ? h('div', {class:'small muted', style:'margin-top:6px'}, d.note) : null);
}
function backupText(){ return JSON.stringify({app:'td2-drop-tracker', v:3, exported:new Date().toISOString(), catalog:S.catalog, drops:S.drops}); }
function stamp(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); }
function download(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = h('a', {href:url, download:name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function markBackup(){ S.backupTs = Date.now(); persist(); }
function exportJSON(){
  if (NATIVE){ pendingBackup = true; nCall('exportFile', 'td2-drops-backup-' + stamp() + '.json', 'application/json', backupText()); return; }
  download('td2-drops-backup-' + stamp() + '.json', backupText(), 'application/json'); markBackup(); renderHist(); toast('Backup exported');
}
function exportCSV(){
  const esc = v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['date','type','set','slot','rarity','named','core','attribute_1','attribute_2','talent','unique_perk','note'];
  const lines = [head.join(',')];
  for (const d of S.drops.slice().sort((a, b) => a.ts - b.ts)){
    lines.push([d.ts ? new Date(d.ts).toISOString() : '', CAT_LABEL[d.cat], d.set || '', d.slot, d.rarity, d.named || '', d.core || '',
      (d.attrs || [])[0] || '', (d.attrs || [])[1] || '', d.talent || '', dropPerk(d) || '', d.note || ''].map(esc).join(','));
  }
  const csv = '﻿' + lines.join('\n');
  if (NATIVE){ pendingBackup = false; nCall('exportFile', 'td2-drops-' + stamp() + '.csv', 'text/csv', csv); return; }
  download('td2-drops-' + stamp() + '.csv', csv, 'text/csv');
}
function copyText(ta){
  const done = () => { markBackup(); toast('Copied to clipboard'); };
  if (NATIVE){ if (nCall('copy', ta.value) === 'ok') done(); else fallbackCopy(ta, done); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => fallbackCopy(ta, done));
  else fallbackCopy(ta, done);
}
function fallbackCopy(ta, done){
  ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  ta.setAttribute('readonly', '');
  if (ok) done(); else toast('Select the text and copy it manually');
}
function importData(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('That text isn’t a valid backup.'); return false; }
  const arr = Array.isArray(d) ? d : d && d.drops;
  if (!Array.isArray(arr)){ alert('That backup has no drops.'); return false; }
  const ids = new Set(S.drops.map(x => x.id));
  let added = 0;
  for (const x of migrateAll(arr)){
    if (ids.has(x.id)) continue;
    S.drops.push(x); ids.add(x.id); added++;
  }
  S.drops.sort((a, b) => a.ts - b.ts);
  if (d && d.catalog && d.catalog.v === 3 && confirm('The backup includes a catalog. Replace your current catalog with it?')){ S.catalog = normalizeCatalog(d.catalog); resetSelections(); }
  persist();
  toast(plural(added, 'drop') + ' imported');
  return true;
}
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { importData(String(rd.result)); renderView(); };
  rd.readAsText(f);
  e.target.value = '';
});
function clearAll(){
  if (!S.drops.length) return;
  if (!confirm('Delete all ' + plural(S.drops.length, 'drop') + '? This can’t be undone.')) return;
  if (!confirm('Please confirm again: every drop will be deleted.')) return;

}

const ngToText = l => l.map(x => [x.n, x.set, x.slot, x.perk].join(' | ')).join('\n');
const nwToText = l => l.map(x => [x.n, x.type, x.perk, x.base].join(' | ').replace(/ \| $/, '')).join('\n');
function parseNamed(text, kind){
  const ok = [], bad = [];
  for (const line of text.split(/\r?\n/)){
    if (!line.trim()) continue;
    const p = line.split('|').map(s => s.trim());
    if (kind === 'gear'){
      if (p.length >= 3 && p[0] && p[1] && GEAR_SLOTS.includes(p[2])) ok.push({n:p[0], set:p[1], slot:p[2], perk:p[3] || 'Unique perk'}); else bad.push(line);
    } else {
      const type = T_ABBR[p[1]] || p[1];
      if (p.length >= 2 && p[0] && WEAPON_TYPES.includes(type)) ok.push({n:p[0], type, perk:p[2] || 'Unique talent', base:p[3] || ''}); else bad.push(line);
    }
  }
  return {ok, bad};
}

      S.catalog = clone(DEFAULT_CATALOG); catDirty = false; CW = null; resetSelections(); persist(); renderCatalog(); toast('Catalog restored');
    }}, 'Restore defaults')));
}
function renderWTalents(container){
  container.replaceChildren();
  for (const t of CW.weaponTalents){
    const name = h('input', {type:'text', value:t.n, 'aria-label':'Talent name', oninput: e => { t.n = e.target.value.trim(); markDirty(); }});
    const del = h('button', {type:'button', class:'icon-btn', 'aria-label':'Remove talent', onclick: () => {
      CW.weaponTalents.splice(CW.weaponTalents.indexOf(t), 1); markDirty(); renderWTalents(container);
    }}, '×');
    const mini = h('div', {class:'mini'});
    for (const s of WEAPON_TYPES){
      const b = h('button', {type:'button', class:'mchip', 'aria-pressed': t.w.includes(s) ? 'true' : 'false', onclick: () => {
        const j = t.w.indexOf(s); if (j >= 0) t.w.splice(j, 1); else t.w.push(s);
        b.setAttribute('aria-pressed', t.w.includes(s) ? 'true' : 'false'); markDirty();
      }}, W_SHORT[s]);
      mini.append(b);
    }
    container.append(h('div', {class:'wt-row'}, h('div', {class:'wt-top'}, name, del), mini));
  }
}
function saveCatalog(){
  const g = parseNamed(CW.ngText, 'gear'), w = parseNamed(CW.nwText, 'weapon');
  const bad = g.bad.length + w.bad.length;
  if (bad && !confirm(plural(bad, 'Named line') + ' couldn’t be read (check the slot or type) and will be skipped:\n\n' + g.bad.concat(w.bad).slice(0, 6).join('\n') + '\n\nSave anyway?')) return;
  const next = Object.assign({}, CW, {namedGear: g.ok, namedWeapons: w.ok});
  delete next.ngText; delete next.nwText;
  next.weaponTalents = next.weaponTalents.filter(t => t.n);
  next.v = 3;
  S.catalog = normalizeCatalog(next);
  catDirty = false; CW = null;
  resetSelections();
  persist();
  renderCatalog();
  toast('Catalog saved');
}
window.addEventListener('beforeunload', e => { if (catDirty){ e.preventDefault(); e.returnValue = ''; } });

/* ================= Start ================= */
if (NATIVE) nativeLoad(); else load();
updateChrome();
renderView();
})();
</script>
