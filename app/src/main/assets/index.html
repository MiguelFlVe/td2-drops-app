<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1013">
<title>Drops TD2</title>
<style>
:root{
  --bg:#0e1013; --surface:#171a1f; --surface2:#1f232a; --border:#2b3039; --text:#e9ebef; --muted:#97a0ad;
  --accent:#ff7417; --accent-ink:#1b0c00; --accent-soft:rgba(255,116,23,.14);
  --red:#f0564f; --blue:#4d8dff; --yellow:#efc23a; --ok:#39c58a; --danger:#f0564f;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f4f6; --surface:#ffffff; --surface2:#f0f2f5; --border:#d8dce2; --text:#14171c; --muted:#5b6370;
    --accent:#e2600a; --accent-ink:#ffffff; --accent-soft:rgba(226,96,10,.12);
    --red:#d63c35; --blue:#2f6fe0; --yellow:#b88a00; --ok:#1f9a65; --danger:#d63c35; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.app{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:12px}
.t1{font-weight:800;letter-spacing:.02em}
.t2{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.field{margin:16px 0}
.field:first-child{margin-top:4px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.cols-2{display:grid;grid-template-columns:1fr 1fr}
.chips.cols-3{display:grid;grid-template-columns:repeat(3,1fr)}
.chip{min-height:42px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-size:14px;text-align:left;line-height:1.2;display:flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.chip.any{color:var(--muted)}
.chip.any[aria-pressed="true"]{color:var(--text)}
.chip:disabled{opacity:.4}
.c-red{background:var(--red)} .c-blue{background:var(--blue)} .c-yellow{background:var(--yellow)}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:16px;width:100%;min-height:44px;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px}
textarea{line-height:1.4;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.fixed{background:var(--surface2);border:1px dashed var(--border);border-radius:10px;padding:8px 12px}
.fixed-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.fixed-row .k{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actionbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);padding:10px 0 4px;margin-top:4px}
.actionbar .missing{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px 10px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:20;
  background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:14px;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;padding:4px}
.banner{margin:12px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--yellow);background:rgba(239,194,58,.12);font-size:13px}
.big{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kv .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
table.bd{width:100%;border-collapse:collapse;font-size:13px}
table.bd th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border)}
table.bd td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums}
table.bd td.num,table.bd th.num{text-align:right;white-space:nowrap}
table.bd td small{display:block;color:var(--muted)}
table.bd tr.total td{font-weight:800;border-bottom:0}
details{margin-top:4px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
details p,details li{font-size:13px;color:var(--muted)}
details ul{padding-left:18px;margin:6px 0}
.inline{display:flex;align-items:center;gap:10px}
.inline input{width:100px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.drop{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0}
.drop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drop-title{font-weight:700}
.drop-time{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.talent{border-color:var(--accent);color:var(--accent)}
.icon-btn{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted)}
.wt-row{border-top:1px solid var(--border);padding:10px 0}
.wt-row:first-child{border-top:0}
.wt-top{display:flex;gap:8px;align-items:center}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.mchip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.sub-row{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--border)}
.sub-row:first-of-type{border-top:0}
.sub-row b{font-size:14px}
.panel{margin-top:10px}
.panel textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.warn{color:var(--yellow)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.corehead,.corerow{display:grid;grid-template-columns:1.5fr 1fr .9fr;gap:8px;align-items:center}
.corehead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:0 12px 6px}
.corehead span:not(:first-child){text-align:right}
.corelist{display:grid;gap:8px}
.corerow{width:100%;text-align:left;min-height:54px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.corerow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.corerow .cr-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;line-height:1.2}
.corerow .cr-p,.corerow .cr-k{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.corerow small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.corerow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.onboard{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.onboard .box{max-width:420px;width:100%}
.onboard .logo{width:56px;height:56px;border-radius:14px;font-size:18px;margin-bottom:18px}
.onboard h1{font-size:22px;line-height:1.25;margin:0 0 8px}
.onboard p{color:var(--muted);margin:0 0 18px}
.onboard .btn{margin-top:10px}
.banner .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .acts .btn{min-height:38px;padding:6px 12px;font-size:13px}
.dbline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:14px}
.dbline .name{font-weight:700;word-break:break-all}
.dbline .btn{min-height:36px;padding:6px 12px;font-size:13px;flex:none}
@media (max-width:360px){ .chips.cols-3{grid-template-columns:1fr 1fr} .big{font-size:36px} }
</style>
</head>
<body>
<header class="app">
  <div class="wrap bar">
    <div class="brand">
      <div class="logo">TD2</div>
      <div><div class="t1">Drops TD2</div><div class="t2">Registro y probabilidades</div></div>
    </div>
    <span id="count" class="pill">0 drops</span>
  </div>
</header>
<div class="wrap"><div id="banner" class="banner" hidden></div></div>
<main class="wrap">
  <section class="view" data-view="reg"><div id="reg"></div></section>
  <section class="view" data-view="prob" hidden><div class="card"><div id="prob-form"></div></div><div id="prob-results"></div></section>
  <section class="view" data-view="hist" hidden><div id="hist"></div></section>
  <section class="view" data-view="cat" hidden><div id="catalog"></div></section>
</main>
<div id="onboard" class="onboard" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button type="button" data-go="reg" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>Registrar</button>
    <button type="button" data-go="prob">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Probabilidad</button>
    <button type="button" data-go="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Historial</button>
    <button type="button" data-go="cat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Catálogo</button>
  </div>
</nav>

<script>
(function(){
'use strict';

/* ---------- Constantes del juego ---------- */
const ANY = '*';
const TYPES = ['Equipo','Arma'];
const CLASSES = ['Gear','Brand'];
const CLASS_LABEL = {Gear:'Gear Set', Brand:'Brand'};
const GEAR_PIECES = ['Máscara','Mochila','Pechera','Guantes','Pistolera','Rodilleras'];
const TALENT_PIECES = ['Pechera','Mochila'];
const W_SUBS = ['Rifle','Rifle de Asalto','Rifle de Francotirador','Ametralladora Ligera','Subfusil','Escopeta','Pistola'];
const W_SHORT = {'Rifle':'Rifle','Rifle de Asalto':'Asalto','Rifle de Francotirador':'Franco.','Ametralladora Ligera':'AL','Subfusil':'Subfusil','Escopeta':'Escopeta','Pistola':'Pistola'};
const COLOR = {
  'Daño de arma':'red','Blindaje':'blue','Nivel de habilidad':'yellow',
  'Probabilidad de crítico':'red','Daño crítico':'red','Daño de disparo a la cabeza':'red','Manejo de armas':'red',
  'Salud':'blue','Regeneración de blindaje':'blue','Protección contra peligros':'blue','Resistencia a explosivos':'blue',
  'Daño de habilidad':'yellow','Celeridad de habilidad':'yellow','Reparación de habilidades':'yellow','Efectos de estado':'yellow'
};
/* La versión 1.5 guardó el core como color; se convierte de vuelta al nombre del atributo */
const CORE_LEGACY = {'Rojo':'Daño de arma', 'Azul':'Blindaje', 'Amarillo':'Nivel de habilidad'};
const WT = (n, w) => ({n, w: (w || W_SUBS).slice()});
const DEFAULT_CATALOG = {
  gearCores: ['Daño de arma','Blindaje','Nivel de habilidad'],
  gearMinors: ['Probabilidad de crítico','Daño crítico','Daño de disparo a la cabeza','Manejo de armas',
    'Salud','Regeneración de blindaje','Protección contra peligros','Resistencia a explosivos',
    'Daño de habilidad','Celeridad de habilidad','Reparación de habilidades','Efectos de estado'],
  gearTalents: {
    'Brand|Pechera': ['Braced','Companion','Efficient','Empathic Resolve','Entrench','Explosive Delivery','Focus','Glass Cannon',
      'Gunslinger','Headhunter','Intimidate','Kinetic Momentum','Mad Bomber','Obliterate','Overwatch','Protected Reload',
      'Reassigned','Skilled','Spark','Spotter','Tag Team','Tamper Proof','Trauma','Unbreakable','Vanguard'],
    'Brand|Mochila': ['Adrenaline Rush','Bloodsucker','Calculated','Clutch','Combined Arms','Composure','Concussion','Creeping Death',
      'Energize','Galvanize','Leadership','Opportunistic','Overclock','Protector','Safeguard','Shock and Awe','Tech Support',
      'Unstoppable Force','Versatile','Vigilance','Wicked']
  },
  weapons: {
    'Rifle': {core1:'Daño de rifle', core2:['Daño crítico']},
    'Rifle de Asalto': {core1:'Daño de rifle de asalto', core2:['Daño a la salud']},
    'Rifle de Francotirador': {core1:'Daño de rifle de francotirador', core2:['Daño de disparo a la cabeza']},
    'Ametralladora Ligera': {core1:'Daño de ametralladora ligera', core2:['Daño a objetivos fuera de cobertura']},
    'Subfusil': {core1:'Daño de subfusil', core2:['Probabilidad de crítico']},
    'Escopeta': {core1:'Daño de escopeta', core2:['Daño al blindaje']},
    'Pistola': {core1:'Daño de pistola', core2:[]}
  },
  weaponMinors: ['Probabilidad de crítico','Daño crítico','Daño de disparo a la cabeza','Daño a la salud','Daño al blindaje','Daño a objetivos fuera de cobertura'],
  weaponTalents: [
    WT('Breadbasket'), WT('Close & Personal'), WT('Determined'), WT('Eyeless'), WT('Fast Hands'), WT('Flatline'),
    WT('Future Perfect'), WT('Ignited'), WT('In Sync'), WT('Killer'), WT('Optimist'), WT('Perpetuation'), WT('Preservation'),
    WT('Ranger'), WT('Reformation'), WT('Sadist'), WT('Sledgehammer'), WT('Spike'), WT('Steady Handed'), WT('Strained'),
    WT('Streamline'), WT('Vindictive'),
    WT('Lucky Shot', ['Rifle','Rifle de Francotirador','Pistola']),
    WT('Measured', ['Rifle de Asalto','Subfusil','Ametralladora Ligera']),
    WT('Rifleman', ['Rifle']), WT('Boomerang', ['Rifle']),
    WT('Near Sighted', ['Rifle de Asalto']), WT('On Empty', ['Rifle de Asalto']), WT('Overflowing', ['Rifle de Asalto']),
    WT('Naked', ['Rifle de Francotirador']), WT('First Blood', ['Rifle de Francotirador']),
    WT('Pummel', ['Escopeta']), WT('Pumped Up', ['Escopeta']),
    WT('Outsider', ['Subfusil']), WT('Unwavering', ['Subfusil']),
    WT('Unhinged', ['Ametralladora Ligera']), WT('Frenzy', ['Ametralladora Ligera']), WT('Overwhelm', ['Ametralladora Ligera']),
    WT('Salvage', ['Pistola']), WT('Finisher', ['Pistola'])
  ]
};

/* ---------- Utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const coll = (a, b) => a.localeCompare(b, 'es');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const dot = c => c ? h('span', {class:'dot c-' + c}) : null;
function fmtPct(p){
  if (!isFinite(p) || p <= 0) return '0\u00a0%';
  const v = p * 100;
  let s;
  if (v >= 99.95) s = '100';
  else if (v >= 10) s = v.toLocaleString('es-CO', {maximumFractionDigits:1});
  else if (v >= 1) s = v.toLocaleString('es-CO', {maximumFractionDigits:2});
  else s = v.toLocaleString('es-CO', {maximumSignificantDigits:3});
  return s + '\u00a0%';
}
const fmtInt = n => isFinite(n) ? Math.round(n).toLocaleString('es-CO') : '∞';
const fmtNum = (n, d) => (n > 0 && n < 0.01)
  ? n.toLocaleString('es-CO', {maximumSignificantDigits: 2})
  : n.toLocaleString('es-CO', {maximumFractionDigits: d == null ? 1 : d});
const oneIn = p => p > 0 ? '≈ 1 de cada ' + fmtInt(1 / p) + ' drops' : '—';
function needed(p, q){ if (p <= 0) return Infinity; if (p >= 1) return 1; return Math.ceil(Math.log(1 - q) / Math.log(1 - p)); }
function parseLines(t){ const seen = new Set(); return t.split(/\r?\n/).map(s => s.trim()).filter(s => s && !seen.has(s) && seen.add(s)); }
function cleanList(a){ return Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : null; }
/* Versión anterior: el Gear Set se guardaba como talento de la pechera/mochila */
function migrateDrop(d){
  if (d && d.cat === 'Equipo' && d.clase === 'Gear' && d.talent && !d.set){ d.set = d.talent; d.talent = null; }
  if (d && d.cat === 'Equipo' && CORE_LEGACY[d.core]) d.core = CORE_LEGACY[d.core];
  return d;
}

/* ---------- Estado y guardado ---------- */
const KEY = 'td2-drop-tracker-v1';
const S = {drops: [], catalog: clone(DEFAULT_CATALOG), backupTs: 0};
let storageOK = true;

function normalizeCatalog(c){
  const d = clone(DEFAULT_CATALOG);
  if (!c || typeof c !== 'object') return d;
  const out = {
    gearCores: [...new Set((cleanList(c.gearCores) || d.gearCores).map(x => CORE_LEGACY[x] || x))],
    gearMinors: cleanList(c.gearMinors) || d.gearMinors,
    weaponMinors: cleanList(c.weaponMinors) || d.weaponMinors,

const NATIVE = !!window.AndroidDB;

function applyData(d){
  const before = JSON.stringify(S.catalog);
  S.drops = Array.isArray(d && d.drops) ? d.drops.filter(x => x && typeof x === 'object').map(migrateDrop) : [];
  S.catalog = d && d.catalog ? normalizeCatalog(d.catalog) : clone(DEFAULT_CATALOG);

}
function isDbData(d){ return !!d && typeof d === 'object' && !Array.isArray(d) && (Array.isArray(d.drops) || d.app === 'td2-drop-tracker'); }
function parseDb(text){ try{ const d = JSON.parse(text); return isDbData(d) ? d : null; }catch(e){ return null; } }

/* ---- Puente nativo ---- */
function nCall(fn, ...a){ try{ return window.AndroidDB[fn](...a); }catch(e){ return null; } }
function nJSON(fn, ...a){ const r = nCall(fn, ...a); try{ return r ? JSON.parse(r) : null; }catch(e){ return null; } }

function loadCacheInto(){ const d = parseDb(nCall('loadCache') || ''); if (d) applyData(d); }

function nativeLoad(){
  nativeStatus();
  dbBlocked = false; dbError = '';
  if (!db.hasFile){ loadCacheInto(); return; }
  const r = nJSON('load') || {ok:false, error:'error desconocido'};
  if (!r.ok){
    dbBlocked = true;
    dbError = 'No se pudo abrir ' + (db.name || 'el archivo de datos') + ' (¿lo moviste o lo borraste?). Estás viendo la copia interna de la app: elige el archivo de nuevo o crea uno nuevo.';
    loadCacheInto(); return;
  }
  const text = r.text || '';
  if (!text.trim()){ loadCacheInto(); persist(); return; }
  const d = parseDb(text);
  if (!d){
    dbBlocked = true;
    dbError = (db.name || 'El archivo') + ' no es una base de datos válida de Drops TD2, así que no se modificará. Estás viendo la copia interna de la app.';
    loadCacheInto(); return;
  }
  applyData(d); lastText = text; nCall('saveCache', text);
}
function nativePick(mode){ nCall(mode === 'create' ? 'createDb' : 'openDb'); }

window.__dbReady = function(mode){
  const wasBlocked = dbBlocked, before = S.drops.slice();
  nativeStatus();
  if (mode === 'created'){
    dbBlocked = false; persist();
    toast('Base de datos creada: ' + db.name);
  } else {
    const r = nJSON('load');
    const text = r && r.ok ? (r.text || '') : null;
    const d = text && text.trim() ? parseDb(text) : null;
    if (text === null){ alert('No se pudo leer ese archivo.'); nCall('revert'); nativeStatus(); }
    else if (!text.trim()){ dbBlocked = false; persist(); toast('Archivo vacío: se guardaron ahí tus datos actuales'); }
    else if (!d){ alert('Ese archivo no es una base de datos ni un respaldo de Drops TD2.'); nCall('revert'); nativeStatus(); }
    else {
      if (applyData(d)) resetSelections();
      lastText = text; dbBlocked = false; storageOK = true; dbError = '';
      if (wasBlocked){
        const ids = new Set(S.drops.map(x => x.id)); let extra = 0;
        for (const x of before) if (x && x.id && !ids.has(x.id)){ S.drops.push(x); extra++; }
        if (extra){ S.drops.sort((a, b) => a.ts - b.ts); persist(); }
        else nCall('saveCache', text);
      } else nCall('saveCache', text);
      toast('Archivo abierto: ' + db.name + ' (' + fmtInt(S.drops.length) + ' drops)');
    }
  }

};
window.__onResume = function(){
  if (!db.hasFile || dbBlocked) return;

    const d = parseDb(r.text);
    if (d){ if (applyData(d)) resetSelections(); lastText = r.text; nCall('saveCache', r.text); updateChrome(); renderView(); toast('Datos recargados: el archivo cambió fuera de la app'); }
  }

/* =========================================================
   2) PROBABILIDAD
   ========================================================= */
const Q = {cat:'Equipo', clase:ANY, sub:ANY, core:ANY, core2:ANY, minors:[], talent:ANY};
let nextM = 100;
const blankSel = cat => ({cat, clase:ANY, sub:ANY, core:ANY, core2:ANY, minors:[], talent:ANY});

function inc(o, k){ if (k == null) return; o[k] = (o[k] || 0) + 1; }
/* En equipo, cada atributo core es un grupo aparte: clase, pieza, menores y talento se cuentan por core */
const newGroup = () => ({n:0, gClase:{}, gPiece:{}, gMinor:{}, gTal:{}});
const EMPTY_GROUP = newGroup();
function buildStats(drops){
  const st = {n:0, type:{}, gCore:{}, gByCore:{}, wSub:{}, wCore2:{}, wMinor:{}, wTal:{}};
  for (const d of drops){
    st.n++; inc(st.type, d.cat);
    if (d.cat === 'Equipo'){
      inc(st.gCore, d.core);
      const g = st.gByCore[d.core] = st.gByCore[d.core] || newGroup();
      g.n++; inc(g.gClase, d.clase); inc(g.gPiece, d.sub);
      (d.minors || []).forEach(m => inc(g.gMinor, m));
      if (d.talent){ const k = d.clase + '|' + d.sub; g.gTal[k] = g.gTal[k] || {}; inc(g.gTal[k], d.talent); }
    } else if (d.cat === 'Arma'){
      inc(st.wSub, d.sub);
      st.wCore2[d.sub] = st.wCore2[d.sub] || {}; inc(st.wCore2[d.sub], d.core2);
      (d.minors || []).forEach(m => inc(st.wMinor, m));
      inc(st.wTal, d.talent);
    }
  }
  return st;
}
const EMPTY = buildStats([]);
/* Estimación suavizada (Laplace): (veces + 1) / (total del grupo + nº de opciones) */
function sp(v, counts, pool){
  if (!pool.length || !pool.includes(v)) return 0;
  let n = 0; for (const x of pool) n += (counts && counts[x]) || 0;
  return (((counts && counts[v]) || 0) + 1) / (n + pool.length);
}
function minorDist(g){ const pool = C().gearMinors, m = {}; for (const v of pool) m[v] = sp(v, g.gMinor, pool); return m; }
/* Brand: dos atributos distintos, extraídos sin repetición */
function minorsProb(c, minors, dist){
  if (!minors.length) return 1;
  if (c === 'Gear') return minors.length === 1 ? (dist[minors[0]] || 0) : 0;
  const pool = Object.keys(dist);
  if (minors.length === 1){
    const a = minors[0], pa = dist[a] || 0; if (!pa) return 0;
    let s = pa;
    for (const b of pool){ if (b === a) continue; const pb = dist[b]; if (pb < 1) s += pb * pa / (1 - pb); }
    return Math.min(1, s);
  }
  const [a, b] = minors, pa = dist[a] || 0, pb = dist[b] || 0;
  if (!pa || !pb || a === b) return 0;
  return (pa < 1 ? pa * pb / (1 - pa) : 0) + (pb < 1 ? pb * pa / (1 - pb) : 0);
}
function prob(sel, st){
  if (sel.cat === 'Equipo'){
    const pType = sp('Equipo', st.type, TYPES);
    const corePool = C().gearCores;
    const cores = sel.core === ANY ? corePool : [sel.core];
    const classes = sel.clase === ANY ? CLASSES : [sel.clase];
    const pieces = sel.sub === ANY ? GEAR_PIECES : [sel.sub];
    let t = 0;
    for (const core of cores){
      const pk = sp(core, st.gCore, corePool);
      if (!pk) continue;
      const g = st.gByCore[core] || EMPTY_GROUP;   // solo los drops con este core
      const dist = minorDist(g);
      for (const c of classes){
        const pc = sp(c, g.gClase, CLASSES);
        const pm = minorsProb(c, sel.minors, dist);
        if (!pm) continue;
        let pp = 0;
        for (const s of pieces){
          const ps = sp(s, g.gPiece, GEAR_PIECES);
          let pt = 1;
          if (sel.talent !== ANY) pt = c === 'Brand' ? sp(sel.talent, g.gTal['Brand|' + s], gearTalentPool('Brand', s)) : 0;
          pp += ps * pt;
        }
        t += pk * pc * pp * pm;
      }
    }
    return pType * t;
  }
  const pType = sp('Arma', st.type, TYPES);
  const subs = sel.sub === ANY ? W_SUBS : [sel.sub];
  let t = 0;
  for (const s of subs){
    const cfg = wCfg(s);
    const ps = sp(s, st.wSub, W_SUBS);
    let pc2 = 1;
    if (sel.core2 !== ANY){
      if (!cfg.core2.length) pc2 = 0;
      else if (cfg.core2.length === 1) pc2 = cfg.core2[0] === sel.core2 ? 1 : 0;
      else pc2 = sp(sel.core2, st.wCore2[s], cfg.core2);
    }
    let pm = 1;
    if (sel.minors.length) pm = sp(sel.minors[0], st.wMinor, wMinorPool(s, sel.core2 !== ANY && cfg.core2.length > 1 ? sel.core2 : null));
    const pt = sel.talent === ANY ? 1 : sp(sel.talent, st.wTal, wTalentPool(s));
    t += ps * pc2 * pm * pt;
  }
  return pType * t;
}
function matches(d, sel){
  if (d.cat !== sel.cat) return false;
  if (sel.clase !== ANY && d.clase !== sel.clase) return false;
  if (sel.sub !== ANY && d.sub !== sel.sub) return false;
  if (sel.core !== ANY && d.core !== sel.core) return false;
  if (sel.core2 !== ANY && d.core2 !== sel.core2) return false;
  for (const m of sel.minors) if (!(d.minors || []).includes(m)) return false;
  if (sel.talent !== ANY && d.talent !== sel.talent) return false;
  return true;
}
function levels(sel){
  const keys = sel.cat === 'Equipo' ? ['core','clase','sub','minors','talent'] : ['sub','core2','minors','talent'];
  let cur = blankSel(sel.cat);
  const out = [{key:'cat', sel:cur}];
  for (const k of keys){
    const isAny = k === 'minors' ? !sel.minors.length : sel[k] === ANY;
    if (isAny) continue;
    cur = Object.assign({}, cur, {[k]: k === 'minors' ? sel.minors.slice() : sel[k]});
    out.push({key:k, sel:cur});
  }
  return out;
}
function levelLabel(k, sel){
  switch (k){
    case 'cat': return ['Tipo', sel.cat];
    case 'clase': return ['Clase', CLASS_LABEL[sel.clase]];
    case 'sub': return [sel.cat === 'Equipo' ? 'Pieza' : 'Subtipo', sel.sub];
    case 'core': return ['Core', sel.core];
    case 'core2': return ['Core 2', sel.core2];
    case 'minors': return [sel.minors.length > 1 ? 'Menores' : 'Menor', sel.minors.join(' + ')];
    case 'talent': return ['Talento', sel.talent];
  }
  return [k, ''];
}

function talentPoolQ(){
  if (Q.cat === 'Equipo'){
    if (!TALENT_PIECES.includes(Q.sub) || Q.clase === 'Gear') return [];

function minorPoolQ(){

}
function describeBase(){
  if (Q.cat === 'Equipo'){
    const p = Q.sub === ANY ? 'pieza de equipo' : Q.sub;

}
function renderResults(){

    rows.push({key:l.key, sel:l.sel, fd: pd0 > 0 ? pd / pd0 : 0, ft: pt0 > 0 ? pt / pt0 : 0, c, n:c0});

    h('details', {},

        h('li', {}, 'Cada característica se estima con tus drops como (veces que salió + 1) / (total del grupo + nº de opciones). Con pocos datos se parece al supuesto teórico; con muchos, a lo que realmente te ha caído.'),
        h('li', {}, 'En equipo, cada atributo core es un grupo aparte: primero se estima qué tan seguido te sale cada core y, dentro de cada uno, la clase, la pieza, los atributos menores y el talento se estiman solo con tus drops de ese core.'),
        h('li', {}, 'Atributos y talentos de arma se estiman con todas tus armas, limitados a lo que puede salir en ese subtipo. Talentos de Brand, por pieza; en Gear Set el talento viene con el set.'),

        h('li', {}, 'El loot dirigido y la fuente del drop cambian las probabilidades reales: para comparar, conviene registrar drops de una misma actividad.')))));

function exportCSV(){

  const head = ['fecha','tipo','clase','subtipo','core','core_arma','core_2','menor_1','menor_2','talento','nota'];
  const lines = [head.join(',')];
  for (const d of S.drops.slice().sort((a, b) => a.ts - b.ts)){
    lines.push([new Date(d.ts).toISOString(), d.cat, d.clase ? CLASS_LABEL[d.clase] : '', d.sub, d.core || '', d.core1 || '', d.core2 || '',

  }
  const csv = '\ufeff' + lines.join('\n');
  if (NATIVE){ pendingBackup = false; nCall('exportFile', 'td2-drops-' + stamp() + '.csv', 'text/csv', csv); return; }

function copyText(ta){

function importData(text){
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('El texto no es un respaldo válido.'); return false; }
  const arr = Array.isArray(d) ? d : d && d.drops;
  if (!Array.isArray(arr)){ alert('El respaldo no contiene drops.'); return false; }
  const ids = new Set(S.drops.map(x => x.id));
  let added = 0;
  for (const x of arr){
    if (!x || !TYPES.includes(x.cat) || !x.sub) continue;
    if (!x.id) x.id = uid();
    if (ids.has(x.id)) continue;
    if (!x.ts) x.ts = Date.now();
    if (!Array.isArray(x.minors)) x.minors = [];
    migrateDrop(x);
    S.drops.push(x); ids.add(x.id); added++;
  }
  S.drops.sort((a, b) => a.ts - b.ts);
  if (d && d.catalog && confirm('El respaldo incluye un catálogo. ¿Reemplazar tu catálogo actual por el del respaldo?')) S.catalog = normalizeCatalog(d.catalog);
  persist();
  toast(fmtInt(added) + ' drops importados');
  return true;
}
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { importData(String(rd.result)); renderView(); };
  rd.readAsText(f);
  e.target.value = '';
});
function clearAll(){
  if (!S.drops.length) return;
  if (!confirm('¿Borrar los ' + S.drops.length + ' drops registrados? Esta acción no se puede deshacer.')) return;
  if (!confirm('Confirma de nuevo: se borrarán todos los drops.')) return;
  S.drops = []; persist(); renderHist(); toast('Drops borrados');
}

/* =========================================================
   4) CATÁLOGO EDITABLE
   ========================================================= */
let CW = null;
function markDirty(){ catDirty = true; const b = $('#catsave'); if (b) b.disabled = false; }
function listArea(get, set, rows){
  const ta = h('textarea', {rows: String(rows || 6), spellcheck:'false'});
  ta.value = get().join('\n');
  ta.addEventListener('input', () => { set(parseLines(ta.value)); markDirty(); });
  return ta;
}
function renderCatalog(){
  if (!catDirty || !CW) CW = clone(S.catalog);
  const root = $('#catalog');
  root.replaceChildren();
  root.append(h('p', {class:'small muted', style:'margin:12px 2px 0'},
    'Listas precargadas con los atributos y talentos del juego. Edítalas si una temporada agrega o cambia algo: una opción por línea. Cambiar un nombre no modifica los drops ya registrados.'));

  root.append(card('Equipo · atributos',
    field('Core', listArea(() => CW.gearCores, v => { CW.gearCores = v; }, 3)),
    field('Atributos menores', listArea(() => CW.gearMinors, v => { CW.gearMinors = v; }, 8))));

  root.append(card('Equipo · talentos Brand',
    h('p', {class:'small muted', style:'margin:0'}, 'Las piezas de Gear Set traen el talento propio del set, así que no se listan aquí.'),
    field('Pechera', listArea(() => CW.gearTalents['Brand|Pechera'], v => { CW.gearTalents['Brand|Pechera'] = v; }, 7)),
    field('Mochila', listArea(() => CW.gearTalents['Brand|Mochila'], v => { CW.gearTalents['Brand|Mochila'] = v; }, 7))));

  const wc = card('Armas · atributos core');
  for (const s of W_SUBS){
    const w = CW.weapons[s];
    const i1 = h('input', {type:'text', value:w.core1, 'aria-label':'Core 1 ' + s, oninput: e => { w.core1 = e.target.value.trim(); markDirty(); }});
    const i2 = h('input', {type:'text', value:w.core2.join('; '), placeholder:'Sin atributo secundario', 'aria-label':'Core 2 ' + s,
      oninput: e => { w.core2 = e.target.value.split(';').map(x => x.trim()).filter(Boolean); markDirty(); }});
    wc.append(h('div', {class:'sub-row'}, h('b', {}, s), i1, i2));
  }
  wc.append(h('p', {class:'small muted', style:'margin:8px 0 0'}, 'Si el secundario puede variar, separa las opciones con punto y coma (;).'));
  root.append(wc);

  root.append(card('Armas · atributo menor',
    field('Opciones', listArea(() => CW.weaponMinors, v => { CW.weaponMinors = v; }, 6), 'se excluye el secundario del arma')));

  const wtCard = card('Armas · talentos');
  wtCard.append(h('p', {class:'small muted', style:'margin:0 0 6px'}, 'Marca en qué armas puede salir cada talento.'));
  const wtList = h('div', {});
  wtCard.append(wtList);
  CW.weaponTalents.sort((a, b) => coll(a.n, b.n));
  renderWTalents(wtList);
  const newIn = h('input', {type:'text', placeholder:'Nuevo talento'});
  wtCard.append(h('div', {class:'wt-top', style:'margin-top:10px'}, newIn,
    h('button', {type:'button', class:'btn', onclick: () => {
      const n = newIn.value.trim(); if (!n) return;
      CW.weaponTalents.push({n, w: W_SUBS.slice()}); newIn.value = ''; markDirty(); renderWTalents(wtList);
    }}, 'Añadir')));
  root.append(wtCard);

  root.append(h('div', {class:'actionbar'},
    h('button', {type:'button', class:'btn primary block', id:'catsave', disabled: !catDirty, onclick: saveCatalog}, 'Guardar catálogo'),
    h('button', {type:'button', class:'btn block', style:'margin-top:8px', onclick: () => {
      if (!confirm('¿Restaurar el catálogo original? Tus drops no se borran.')) return;
      S.catalog = clone(DEFAULT_CATALOG); catDirty = false; CW = null; persist(); renderCatalog(); toast('Catálogo restaurado');
    }}, 'Restaurar valores originales')));
}
function renderWTalents(container){
  container.replaceChildren();
  for (const t of CW.weaponTalents){
    const name = h('input', {type:'text', value:t.n, 'aria-label':'Nombre del talento', oninput: e => { t.n = e.target.value.trim(); markDirty(); }});
    const del = h('button', {type:'button', class:'icon-btn', 'aria-label':'Eliminar talento', onclick: () => {
      CW.weaponTalents.splice(CW.weaponTalents.indexOf(t), 1); markDirty(); renderWTalents(container);
    }}, '×');
    const mini = h('div', {class:'mini'});
    for (const s of W_SUBS){
      const b = h('button', {type:'button', class:'mchip', 'aria-pressed': t.w.includes(s) ? 'true' : 'false', onclick: () => {
        const j = t.w.indexOf(s); if (j >= 0) t.w.splice(j, 1); else t.w.push(s);
        b.setAttribute('aria-pressed', t.w.includes(s) ? 'true' : 'false'); markDirty();
      }}, W_SHORT[s]);
      mini.append(b);
    }
    container.append(h('div', {class:'wt-row'}, h('div', {class:'wt-top'}, name, del), mini));
  }
}
function saveCatalog(){
  CW.weaponTalents = CW.weaponTalents.filter(t => t.n);
  S.catalog = normalizeCatalog(CW);
  catDirty = false; CW = null;
  persist();
  // Limpia selecciones que ya no existan
  Object.assign(R, {core:null, minors:[], talent:null});
  Object.assign(Q, blankSel(Q.cat));
  renderCatalog();
  toast('Catálogo guardado');
}
window.addEventListener('beforeunload', e => { if (catDirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- Inicio ---------- */
if (NATIVE) nativeLoad(); else load();
updateChrome();
renderView();
})();
</script>
